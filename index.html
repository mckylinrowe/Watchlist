<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0A0A0A; color: #F5F5F5; font-family: 'DM Sans', -apple-system, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0A0A0A; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  .app { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .serif { font-family: 'Playfair Display', serif; }

  /* Profile picker */
  .picker { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .picker h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
  .picker-row { display: flex; gap: 24px; }
  .picker-card { width: 140px; height: 140px; border-radius: 12px; border: 2px solid #2a2a2a; background: #141414; color: #F5F5F5; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: transform 0.15s; }
  .picker-card:hover { transform: scale(1.05); }
  .picker-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #0A0A0A; }

  /* Header */
  .header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 4px; }
  .header-spacer { min-width: 0; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; text-align: center; }
  .header-right { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .user-chip { display: flex; align-items: center; gap: 8px; background: #141414; border: 1px solid #2a2a2a; border-radius: 20px; padding: 5px 12px 5px 6px; font-size: 13px; }
  .user-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0A0A0A; }
  .switch-btn { background: none; border: none; color: #888; font-size: 12px; text-decoration: underline; }

  /* Tabs -- shares a row with the titles/seen-count line so they sit on the
     same plane; a 3-column grid keeps the tabs truly centered regardless of
     how wide that text is, mirroring the header's title-centering layout. */
  .main-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 14px; }
  .header-sub { font-size: 10px; color: #666; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
  .main-row-spacer { min-width: 0; }
  .main-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .main-tab { background: #141414; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
  .main-tab.active { background: #D2601A; border-color: #D2601A; color: #0A0A0A; }

  .status-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .status-tab { background: transparent; border: 1px solid #2a2a2a; color: #ccc; border-radius: 16px; padding: 5px 12px; font-size: 12.5px; }
  .status-tab.active { color: #0A0A0A; font-weight: 700; }

  .pill-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .pill-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
  .pill { background: transparent; border: 1px solid #2a2a2a; color: #bbb; border-radius: 14px; padding: 4px 11px; font-size: 12px; transition: all 0.15s; }
  .pill:hover { border-color: #D2601A; color: #D2601A; }
  .pill.active { background: #F5F5F5; border-color: #F5F5F5; color: #0A0A0A; font-weight: 600; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-input { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none; }
  .search-input:focus { border-color: #D2601A; }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; margin-top: 6px; max-height: 380px; overflow-y: auto; z-index: 50; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .search-result { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; }
  .search-result:last-child { border-bottom: none; }
  .search-thumb { width: 36px; height: 54px; border-radius: 4px; object-fit: cover; background: #2a2a2a; flex-shrink: 0; }
  .search-info { flex: 1; min-width: 0; }
  .search-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-sub { font-size: 12px; color: #888; }
  .add-btn { background: #D2601A; border: none; color: #0A0A0A; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; flex-shrink: 0; transition: background 0.15s; }
  .add-btn:hover:not(:disabled) { background: #E17A3A; }
  .add-btn:disabled { background: #2a2a2a; color: #777; cursor: default; }

  /* Grid + cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.15s, border-color 0.15s; }
  .card:hover { border-color: #3a3a3a; transform: translateY(-2px); }
  .card-poster { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #1c1c1c; cursor: pointer; display: block; }
  .no-poster { width: 100%; aspect-ratio: 2 / 3; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; text-align: center; padding: 8px; cursor: pointer; background: #1c1c1c; font-family: 'Playfair Display', serif; }
  .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; line-height: 1.25; cursor: pointer; }
  .card-sub { font-size: 11.5px; color: #888; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid #2a2a2a; border-radius: 10px; padding: 1px 7px; font-size: 10.5px; color: #aaa; }
  .streamer-chip { border-radius: 10px; padding: 1px 7px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.6); }
  .seen-dots { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .seen-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0A0A0A; }
  .stars-line, .stars-input { display: inline-flex; align-items: center; }
  .stars-line { font-size: 13px; }
  .star-slot { position: relative; display: inline-block; margin-right: 1px; }
  .star-empty { color: #3a3a3a; }
  .star-fill { position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; color: #D2601A; pointer-events: none; }
  .seen-btn { margin-top: auto; border-radius: 7px; border: 1px solid #2a2a2a; background: transparent; color: #ccc; padding: 6px 0; font-size: 12px; font-weight: 600; }
  .seen-btn.on { color: #0A0A0A; border-color: transparent; }
  .rank-badge { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 3px; z-index: 2; }
  .rank-pill { background: rgba(10,10,10,0.88); border-radius: 6px; padding: 1px 7px; font-size: 10px; font-weight: 700; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; backdrop-filter: blur(4px); }
  .modal { background: #141414; border: 1px solid #2a2a2a; border-radius: 14px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; }
  .modal-hero { display: flex; gap: 16px; padding: 18px; }
  .modal-poster { width: 140px; border-radius: 8px; flex-shrink: 0; align-self: flex-start; }
  .modal-main { flex: 1; min-width: 0; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .modal-tagline { font-family: 'Playfair Display', serif; font-size: 13px; color: #D2601A; font-style: italic; margin-bottom: 8px; }
  .modal-meta { font-size: 12.5px; color: #999; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-overview { font-size: 13.5px; line-height: 1.55; color: #ddd; margin-bottom: 12px; }
  .modal-section { padding: 0 18px 14px; }
  .modal-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .modal-label { font-size: 12px; color: #888; min-width: 78px; font-weight: 600; }
  .stars-input { font-size: 22px; user-select: none; }
  .stars-input .star-slot { cursor: pointer; margin-right: 4px; }
  .note-text { font-size: 13px; color: #ccc; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 10px; flex: 1; }
  .modal-actions { display: flex; gap: 8px; padding: 0 18px 18px; flex-wrap: wrap; }
  .btn { border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; border: 1px solid #2a2a2a; background: transparent; color: #F5F5F5; }

  .btn.danger { border-color: #6b2020; color: #e07a7a; }
  .close-x { position: sticky; top: 0; float: right; margin: 10px 10px 0 0; background: #2a2a2a; border: none; color: #F5F5F5; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; z-index: 5; }

  /* Similar titles strip */
  .similar-section { padding: 0 18px 18px; border-top: 1px solid #2a2a2a; margin-top: 4px; padding-top: 14px; }
  .similar-heading { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .similar-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .similar-item { flex-shrink: 0; width: 84px; cursor: pointer; }
  .similar-poster { width: 84px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; background: #1c1c1c; display: block; }
  .similar-title { font-size: 11px; color: #ccc; margin-top: 4px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .field { width: 100%; background: #0f0f0f; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 8px; padding: 9px 11px; font-size: 14px; outline: none; }
  .field:focus { border-color: #D2601A; }
  select.field option { background: #141414; }
  textarea.field { min-height: 80px; resize: vertical; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

  /* Discover */
  .disc-panel { background: #101010; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 18px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .disc-field { flex: 1; min-width: 140px; }
  .disc-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .disc-error { background: #1a0d0d; border: 1px solid #3a1a1a; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #c98080; }
  input[type="range"] { width: 100%; height: 3px; appearance: none; -webkit-appearance: none; background: #2a2a2a; border-radius: 2px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #D2601A; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #D2601A; cursor: pointer; border: none; }

  .afi-progress { font-size: 12.5px; color: #888; margin-bottom: 12px; }
  .divider { width: 1px; height: 16px; background: #2a2a2a; }
  .empty { text-align: center; color: #666; padding: 60px 20px; font-size: 14px; font-family: 'Playfair Display', serif; font-style: italic; }
  .loading-line { text-align: center; color: #888; padding: 30px; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #141414; border: 1px solid #D2601A; color: #F5F5F5; border-radius: 10px; padding: 10px 18px; font-size: 13px; z-index: 200; }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .stat-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; text-align: center; }
  .stat-number { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
  .stats-section { margin: 26px 0; }
  .stats-heading { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .stats-note { font-size: 11.5px; color: #666; margin-top: 8px; }
  .stats-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
  .stats-col-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .stats-empty { font-size: 12.5px; color: #666; font-style: italic; }
  .genre-bar-row { display: grid; grid-template-columns: 78px 1fr 56px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .genre-bar-label { font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .genre-bar-track { height: 8px; background: #1c1c1c; border-radius: 4px; overflow: hidden; }
  .genre-bar-fill { height: 100%; border-radius: 4px; }
  .genre-bar-value { font-size: 11.5px; color: #999; text-align: right; }
  .stats-list { display: flex; flex-direction: column; gap: 2px; }
  .stats-row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
  .stats-row:hover { background: #141414; }
  .stats-thumb { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #1c1c1c; }
  .stats-thumb-empty { display: block; }
  .stats-row-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .stats-row-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .modal-hero { flex-direction: column; }
    .modal-poster { width: 110px; }
    .header { grid-template-columns: 1fr; text-align: center; }
    .header-spacer { display: none; }
    .header-right { justify-self: center; }
    .main-row { grid-template-columns: 1fr; text-align: center; gap: 8px; }
    .main-row-spacer { display: none; }
  }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc,
    getDocs, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCIKytJXq6yFDGGShcbIGpViyrsU7wzR5U",
    authDomain: "tiffany-watchlist.firebaseapp.com",
    projectId: "tiffany-watchlist",
    storageBucket: "tiffany-watchlist.firebasestorage.app",
    messagingSenderId: "374560916921",
    appId: "1:374560916921:web:e65e997728a6fe6dc1a268"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const moviesCol = collection(db, "movies");
  const metaDoc = doc(db, "meta", "v1");

  window.__fb = {
    // Real-time listener. Callback receives a plain array of docs.
    onMovies(cb) {
      return onSnapshot(moviesCol, (snap) => {
        const docs = [];
        snap.forEach((d) => docs.push({ id: d.id, ...d.data() }));
        cb(docs);
      }, (err) => console.error("onMovies error:", err));
    },
    // setDoc with merge — NEVER updateDoc (updateDoc silently fails on missing docs).
    upsert(id, data) {
      return setDoc(doc(db, "movies", String(id)), data, { merge: true });
    },
    // Alias kept for API compatibility; identical merge semantics.
    update(id, data) {
      return setDoc(doc(db, "movies", String(id)), data, { merge: true });
    },
    remove(id) {
      return deleteDoc(doc(db, "movies", String(id)));
    },
    async getAll() {
      const snap = await getDocs(moviesCol);
      const docs = [];
      snap.forEach((d) => docs.push({ id: d.id, ...d.data() }));
      return docs;
    },
    async clearAll() {
      const snap = await getDocs(moviesCol);
      const deletions = [];
      snap.forEach((d) => deletions.push(deleteDoc(d.ref)));
      await Promise.all(deletions);
    },
    async getMeta() {
      const snap = await getDoc(metaDoc);
      return snap.exists() ? snap.data() : null;
    },
    setMeta(data) {
      return setDoc(metaDoc, data, { merge: true });
    },
    testWrite() {
      return setDoc(metaDoc, { lastTestWrite: Date.now() }, { merge: true });
    }
  };

  window.dispatchEvent(new Event("fb-ready"));
</script>

/* ---------- TMDB helpers ---------- */
async function tmdb(path, params) {
  const url = new URL("https://api.themoviedb.org/3" + path);
  if (params) Object.keys(params).forEach((k) => {
    if (params[k] !== undefined && params[k] !== null && params[k] !== "") url.searchParams.set(k, params[k]);
  });
  const res = await fetch(url, {
    headers: { Authorization: "Bearer " + TMDB_TOKEN, accept: "application/json" },
    signal: AbortSignal.timeout(6000)
  });
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
}

function slugId(title, year) {
  return (title + "_" + (year || "")).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function resultTitle(r) { return r.title || r.name || ""; }
function resultYear(r) {
  const d = r.release_date || r.first_air_date || "";
  return d ? parseInt(d.slice(0, 4), 10) : null;
}

/* Prefer the result whose release year actually matches; TMDB's first hit
   is sometimes a remake or a same-titled short. */
function pickByYear(results, year) {
  if (!results || results.length === 0) return null;
  if (!year) return results[0];
  return results.find((r) => (r.release_date || r.first_air_date || "").startsWith(String(year))) || results[0];
}

function buildDoc(result, details, overrides) {
  const mediaType = result.media_type === "tv" || result.first_air_date ? "tv" : "movie";
  const title = resultTitle(result);
  const year = resultYear(result);
  const genreIds = result.genre_ids || (details && details.genres ? details.genres.map((g) => g.id) : []);
  const genres = Array.from(new Set(genreIds.map((g) => GENRE_NAMES[g]).filter(Boolean)));
  const runtime = details
    ? (mediaType === "tv"
        ? (details.episode_run_time && details.episode_run_time[0]) || null
        : details.runtime || null)
    : null;
  return {
    id: result.id ? String(result.id) : slugId(title, year),
    tmdbId: result.id || null,
    title, year,
    poster: result.poster_path ? IMG + result.poster_path : null,
    genres,
    primaryGenre: genres[0] || null,
    tmdbRating: result.vote_average ? Math.round(result.vote_average * 10) / 10 : null,
    overview: result.overview || (details && details.overview) || "",
    tagline: (details && details.tagline) || "",
    runtime, mediaType,
    category: mediaType === "tv" ? "TV" : "Movies",
    seenBy: [], queuedBy: [], ratings: {}, notes: {},
    streamer: "", addedAt: Date.now(),
    ...(overrides || {})
  };
}

async function searchAndBuild(seed) {
  const ep = seed.mediaType === "tv" ? "tv" : "movie";
  try {
    const params = { query: seed.title };
    if (seed.year) {
      if (ep === "tv") params.first_air_date_year = seed.year;
      else params.year = seed.year;
    }
    const data = await tmdb("/search/" + ep, params);
    const hit = pickByYear(data.results, seed.year);
    if (hit) {
      let details = null;
      try { details = await tmdb("/" + ep + "/" + hit.id); } catch (e) { /* details are nice-to-have */ }
      return buildDoc({ ...hit, media_type: ep }, details, { category: seed.category });
    }
  } catch (e) { console.warn("TMDB search failed for", seed.title, e); }
  // Fallback: title_year slug key so the app still works without a TMDB match
  return {
    id: slugId(seed.title, seed.year), tmdbId: null, title: seed.title, year: seed.year || null,
    poster: null, genres: [], primaryGenre: null, tmdbRating: null,
    overview: "", tagline: "", runtime: null, mediaType: seed.mediaType || "movie",
    category: seed.category || "Movies", seenBy: [], ratings: {}, notes: {},
    streamer: "", addedAt: Date.now()
  };
}

function normalize(d) {
  return {
    ...d,
    seenBy: Array.isArray(d.seenBy) ? d.seenBy : [],
    queuedBy: Array.isArray(d.queuedBy) ? d.queuedBy : [],
    ratings: d.ratings && typeof d.ratings === "object" ? d.ratings : {},
    notes: d.notes && typeof d.notes === "object" ? d.notes : {},
    genres: Array.isArray(d.genres) ? d.genres : [],
    category: d.category === "Tiffany" ? "Movies" : (d.category || "Movies"),
    mediaType: d.mediaType || "movie"
  };
}

/* ---------- Roulette weighting ----------
   Genre affinity is built from EVERY rating on EVERY movie, both users
   combined (each doc's `ratings` object already holds both people's stars),
   so a genre only both of you love pulls double weight; a genre only one
   of you loves still counts, just half as strongly.

   Two refinements over a plain average:
   - mediaType scopes the learning: when Roulette is set to Movies only or
     TV only, it learns from ratings on THAT media type specifically, not a
     blended pool -- your taste in movie comedies and TV comedies isn't
     necessarily the same.
   - Confidence shrinkage: a genre with only one rating shouldn't swing as
     hard as one backed by five. Genres with few ratings get pulled back
     toward neutral; genres with more evidence get their full average. */
function computeGenreAffinity(movies, mediaType) {
  const pool = !mediaType || mediaType === "all" ? movies : movies.filter((m) => m.mediaType === mediaType);
  const genreSum = {};
  const genreCount = {};
  pool.forEach((m) => {
    const stars = Object.values(m.ratings || {});
    if (stars.length === 0) return;
    m.genres.forEach((g) => {
      stars.forEach((s) => {
        genreSum[g] = (genreSum[g] || 0) + s;
        genreCount[g] = (genreCount[g] || 0) + 1;
      });
    });
  });
  const affinity = {};
  Object.keys(genreSum).forEach((g) => {
    const n = genreCount[g];
    const rawAvg = genreSum[g] / n;
    const confidence = Math.min(1, n / 5); // full weight once 5+ ratings back a genre
    affinity[g] = ROULETTE_NEUTRAL_SCORE + confidence * (rawAvg - ROULETTE_NEUTRAL_SCORE);
  });
  return affinity;
}

// Neutral score for genres with no rating history yet, so unrated genres
// still get picked sometimes instead of being frozen out entirely.
const ROULETTE_NEUTRAL_SCORE = 3;
const ROULETTE_MIN_WEIGHT = 0.3;

function weightForMovie(movie, affinity) {
  if (!movie.genres || movie.genres.length === 0) return ROULETTE_NEUTRAL_SCORE;
  const scores = movie.genres.map((g) => (g in affinity ? affinity[g] : ROULETTE_NEUTRAL_SCORE));
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  return Math.max(ROULETTE_MIN_WEIGHT, avg);
}

function weightedRandomPick(candidates, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i];
  }
  return candidates[candidates.length - 1];
}

// Combined average across both users' ratings, or null if nobody's rated it yet.
function averageRating(movie) {
  const stars = Object.values(movie.ratings || {});
  if (stars.length === 0) return null;
  return stars.reduce((a, b) => a + b, 0) / stars.length;
}

/* ---------- Small components ---------- */
// Half-star ratings, Letterboxd-style: each star is two click zones (left
// half sets an X.5, right half sets a whole X). Rendered as a greyed-out
// star with a colored star clipped to 0/50/100% width laid on top, so a
// half rating actually shows half a star, not a rounded whole one.
function Stars({ value, onSet }) {
  const stars = [1, 2, 3, 4, 5];
  const val = value || 0;
  return (
    <span className={onSet ? "stars-input" : "stars-line"}>
      {stars.map((n) => {
        const fillPct = Math.max(0, Math.min(1, val - (n - 1))) * 100;
        return (
          <span
            key={n}
            className="star-slot"
            onClick={onSet ? (e) => {
              e.stopPropagation();
              const rect = e.currentTarget.getBoundingClientRect();
              const leftHalf = (e.clientX - rect.left) < rect.width / 2;
              const clicked = leftHalf ? n - 0.5 : n;
              onSet(clicked === val ? 0 : clicked);
            } : undefined}
          >
            <span className="star-empty">{"\u2605"}</span>
            <span className="star-fill" style={{ width: fillPct + "%" }}>{"\u2605"}</span>
          </span>
        );
      })}
    </span>
  );
}

function SeenDots({ movie }) {
  const bothSeen = USERS.every((u) => movie.seenBy.includes(u));
  return (
    <div className="seen-dots">
      {bothSeen ? (
        <div className="seen-dot" style={{ background: BOTH_SEEN_COLOR }} title="Both seen" />
      ) : (
        USERS.filter((u) => movie.seenBy.includes(u)).map((u) => (
          <div key={u} className="seen-dot" style={{ background: USER_COLORS[u] }} title={u + " has seen this"} />
        ))
      )}
    </div>
  );
}

  // once before anything repeats. Once the whole pool's been shown, the bag
  // clears and a fresh cycle starts. Survives across "Spin Again" clicks.
  const rouletteHistory = useRef([]);
  const afiLoadStarted = useRef(false);
  moviesRef.current = movies;

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  /* Wait for the Firebase module script */
  useEffect(() => {
    if (window.__fb) { setFbReady(true); return; }
    const onReady = () => setFbReady(true);
    window.addEventListener("fb-ready", onReady);
    return () => window.removeEventListener("fb-ready", onReady);
  }, []);

  /* Real-time sync. Callback is SYNCHRONOUS — no awaits inside onSnapshot. */
  useEffect(() => {
    if (!fbReady) return;
    const unsub = window.__fb.onMovies((docs) => {
      const byKey = {};
      const dupes = [];
      docs.forEach((d) => {
        const key = d.tmdbId ? String(d.tmdbId) : String(d.id);
        const existing = byKey[key];
        if (!existing) { byKey[key] = d; return; }
        // Prefer the shorter doc id (stable TMDB-id keys beat legacy slugs)
        if (String(d.id).length < String(existing.id).length) {
          dupes.push(existing.id);
          byKey[key] = d;
        } else {
          dupes.push(d.id);
        }
      });
      // Fire-and-forget dupe deletion — never await inside this callback
      dupes.forEach((id) => { window.__fb.remove(id).catch(() => {}); });
      const list = Object.values(byKey).map(normalize);
      list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
      setMovies(list);
      setSynced(true);
    });
    return unsub;
  }, [fbReady]);

  /* One-time migration: clear preset seenBy where every user is marked seen */
  useEffect(() => {
    if (!synced || migrationRan.current) return;
    migrationRan.current = true;
    window.__fb.getMeta().then((meta) => {
      if (meta && meta.seenCleared) return null;
      const toClear = moviesRef.current.filter((m) => USERS.every((u) => m.seenBy.includes(u)));
      return Promise.all(toClear.map((m) => window.__fb.upsert(m.id, { seenBy: [] })))
        .then(() => window.__fb.setMeta({ seenCleared: true }));
    }).catch((e) => console.error("Migration error:", e));
  }, [synced]);

  /* One-time migration: backfill queuedBy on everything added before the
     Queue feature existed. Both users get added, which -- combined with the
     Queue filter's "not seen by me" clause -- reproduces exactly the old
     Queue behavior for legacy titles. Only genuinely new items (added after
     this shipped) get the curated, single-adder queuedBy going forward. */
  useEffect(() => {
    if (!synced || queueMigrationRan.current) return;
    queueMigrationRan.current = true;
    window.__fb.getMeta().then(async (meta) => {
      if (meta && meta.queueMigrated) return;
      const raw = await window.__fb.getAll();
      const legacy = raw.filter((d) => !Array.isArray(d.queuedBy));
      await Promise.all(legacy.map((d) => window.__fb.upsert(d.id, { queuedBy: [...USERS] })));
      await window.__fb.setMeta({ queueMigrated: true });
    }).catch((e) => console.error("Queue migration error:", e));
  }, [synced]);

  /* Seed when Firestore is completely empty: batches of 5, 250ms apart */
  useEffect(() => {
    if (!synced || seedRan.current || moviesRef.current.length > 0) return;
    seedRan.current = true;
    setSeeding(true);
    (async () => {
      for (let i = 0; i < SEED.length; i += 5) {
        const batch = SEED.slice(i, i + 5);
        const built = await Promise.all(batch.map((s) => searchAndBuild(s)));
        await Promise.all(built.map((doc) => window.__fb.upsert(doc.id, doc)));
        setSeedProgress(Math.min(i + 5, SEED.length));
        if (i + 5 < SEED.length) await new Promise((r) => setTimeout(r, 250));
      }
    })().catch((e) => console.error("Seed error:", e)).finally(() => setSeeding(false));
  }, [synced]);

  /* Resolve AFI titles against TMDB the first time the AFI tab is opened,
     5 at a time / 250ms apart. Lives at App level (not in AfiTab) so it
     doesn't re-run every time the tab unmounts and remounts. */
  useEffect(() => {
    if (mainTab !== "afi" || afiLoadStarted.current) return;
    afiLoadStarted.current = true;
    (async () => {
      for (let i = 0; i < AFI_LIST.length; i += 5) {
        const batch = AFI_LIST.slice(i, i + 5);
        const found = await Promise.all(batch.map(async ([t, y]) => {
          try {
            const data = await tmdb("/search/movie", { query: t, year: y });
            return [slugId(t, y), pickByYear(data.results, y)];
          } catch (e) { return [slugId(t, y), null]; }
        }));
        setAfiData((prev) => {
          const next = { ...prev };
          found.forEach(([key, r]) => { if (r) next[key] = r; });
          return next;
        });
        setAfiProgress(Math.min(i + 5, AFI_LIST.length));
        if (i + 5 < AFI_LIST.length) await new Promise((res) => setTimeout(res, 250));
      }
      setAfiProgress(AFI_LIST.length);
    })().catch((e) => console.warn("AFI load error:", e));
  }, [mainTab]);

  /* Debounced TMDB search */
  useEffect(() => {
    if (searchTimer.current) clearTimeout(searchTimer.current);
    if (!query.trim()) { setResults([]); return; }
    searchTimer.current = setTimeout(async () => {
      try {
        const data = await tmdb("/search/multi", { query: query.trim() });
        setResults((data.results || [])
          .filter((r) => r.media_type === "movie" || r.media_type === "tv")
          .slice(0, 8));
      } catch (e) { console.warn("Search failed:", e); }
    }, 350);
    return () => { if (searchTimer.current) clearTimeout(searchTimer.current); };
  }, [query]);

  /* ---------- Actions (all writes go through upsert = setDoc merge) ---------- */
  const toggleSeen = (movie) => {
    const has = movie.seenBy.includes(user);
    const seenBy = has ? movie.seenBy.filter((u) => u !== user) : movie.seenBy.concat(user);
    window.__fb.upsert(movie.id, { seenBy }).catch((e) => console.error(e));
    if (detail && detail.id === movie.id) setDetail({ ...detail, seenBy });
    if (roulettePick && roulettePick.id === movie.id) setRoulettePick({ ...roulettePick, seenBy });
  };

  const toggleQueued = (movie) => {
    const has = (movie.queuedBy || []).includes(user);
    const queuedBy = has ? movie.queuedBy.filter((u) => u !== user) : (movie.queuedBy || []).concat(user);
    window.__fb.upsert(movie.id, { queuedBy }).catch((e) => console.error(e));
    if (detail && detail.id === movie.id) setDetail({ ...detail, queuedBy });
    if (roulettePick && roulettePick.id === movie.id) setRoulettePick({ ...roulettePick, queuedBy });
  };

  const setRating = (movie, stars) => {
    const ratings = { ...movie.ratings };
    if (stars === 0) delete ratings[user]; else ratings[user] = stars;
    const seenBy = stars > 0 && !movie.seenBy.includes(user)
      ? movie.seenBy.concat(user)
      : movie.seenBy;
    window.__fb.upsert(movie.id, { ratings, seenBy }).catch((e) => console.error(e));
    if (detail && detail.id === movie.id) setDetail({ ...detail, ratings, seenBy });
    if (roulettePick && roulettePick.id === movie.id) setRoulettePick({ ...roulettePick, ratings, seenBy });
  };

  // Picks from *this user's* actual queue (things they've said they want to
  // watch), weighted toward genres both of you rate highly together --
  // learned separately from movie ratings vs TV ratings when a specific
  // media type is selected. Uses the same Format dropdown as the rest of
  // the page -- there's one Movies/TV control, not a separate Roulette-only
  // one, since "what you're browsing" and "what Roulette picks from" are
  // the same idea.
  //
  // No-repeat shuffle: every title shown gets added to a "shown" bag and
  // excluded from the next spin, so a full cycle through your queue never
  // repeats anything. Once every queued title (for the current media
  // filter) has been shown once, the bag clears and a new cycle starts.
  const spinRoulette = () => {
    const wanted = movies.filter((m) => (m.queuedBy || []).includes(user) && !m.seenBy.includes(user));
    const byMedia = mediaFilter === "all" ? wanted : wanted.filter((m) => m.mediaType === mediaFilter);
    if (byMedia.length === 0) {
      const label = mediaFilter === "movie" ? "movies" : mediaFilter === "tv" ? "TV shows" : "anything";
      showToast("Nothing queued for " + label + " yet -- add something to your queue first.");
      return;
    }

    // Drop any shown-ids that fell out of the current pool (seen, unqueued,
    // removed, or a media-filter switch), so a stale bag can't shrink the
    // real pool artificially.
    const poolIds = new Set(byMedia.map((m) => m.id));
    let shownIds = rouletteHistory.current.filter((id) => poolIds.has(id));

    let available = byMedia.filter((m) => !shownIds.includes(m.id));
    if (available.length === 0) {
      // Every title in this pool has been shown -- start a fresh cycle, but
      // don't let the very last pick of the old cycle repeat immediately as
      // the first pick of the new one.
      const lastShown = shownIds[shownIds.length - 1];
      shownIds = [];
      available = byMedia.filter((m) => m.id !== lastShown);
      if (available.length === 0) available = byMedia; // pool of 1 -- nothing else possible
    }

    const affinity = computeGenreAffinity(movies, mediaFilter);
    // Damp the genre-affinity spread (sqrt) so learning still tilts the odds
    // toward what you rate highly, but doesn't make a handful of titles so
    // dominant that they crowd out everything else in the cycle.
    const weights = available.map((m) => Math.sqrt(weightForMovie(m, affinity)));
    const pick = weightedRandomPick(available, weights);

    rouletteHistory.current = [...shownIds, pick.id];
    setRoulettePick(pick);
  };

  const addResult = async (result, overrides, markSeenFor) => {
    const existing = movies.find((m) => String(m.tmdbId) === String(result.id));
    if (existing) {
      if (markSeenFor && !existing.seenBy.includes(markSeenFor)) {
        const seenBy = existing.seenBy.concat(markSeenFor);
        await window.__fb.upsert(existing.id, { seenBy });
        showToast("Marked seen: " + existing.title);
      } else {
        showToast("Already in the watchlist");
      }
      return;
    }
    let details = null;
    try {
      const path = (result.media_type === "tv" ? "/tv/" : "/movie/") + result.id;
      details = await tmdb(path);
    } catch (e) { /* fine without details */ }
    const doc = buildDoc(result, details, overrides);
    if (markSeenFor) {
      doc.seenBy = [markSeenFor];
      doc.queuedBy = [];
    } else {
      // Adding it IS the "I want to watch this" signal -- queue it for whoever added it.
      doc.queuedBy = [user];
    }
    await window.__fb.upsert(doc.id, doc);
    showToast(markSeenFor ? "Added & marked seen: " + doc.title : "Added to your queue: " + doc.title);
  };

  // Rating something you haven't added yet (e.g. from the search bar preview)
  // adds it in the same motion -- rating implies you've seen it, so it's
  // added and marked seen for you, then the real detail view opens so
  // you land in the same place a rating from anywhere else in the app does.
  const addAndRate = async (result, overrides, stars) => {
    const existing = movies.find((m) => String(m.tmdbId) === String(result.id));
    let doc;
    if (existing) {
      doc = {
        ...existing,
        ratings: { ...existing.ratings, [user]: stars },
        seenBy: existing.seenBy.includes(user) ? existing.seenBy : existing.seenBy.concat(user)
      };
    } else {
      let details = null;
      try {
        const path = (result.media_type === "tv" ? "/tv/" : "/movie/") + result.id;
        details = await tmdb(path);
      } catch (e) { /* fine without details */ }
      doc = buildDoc(result, details, overrides);
      doc.ratings = { [user]: stars };
      doc.seenBy = [user];
    }
    await window.__fb.upsert(doc.id, doc);
    showToast("Rated & added: " + doc.title);
    setPreview(null);
    setDetail(doc);
  };

  // Clicking a poster in a "More like this" strip should open the same kind
  // of profile as clicking any other poster in the app: the real detail view
  // if it's already in the watchlist, a preview if it isn't. Only one modal
  // shows at a time, so opening one clears the other.
  const openSimilarTitle = (result, mediaType) => {
    const found = movies.find((m) => String(m.tmdbId) === String(result.id));
    if (found) {
      setPreview(null);
      setDetail(found);
    } else {
      setDetail(null);
      setPreview({ result: { ...result, media_type: mediaType }, mediaType, overrides: {} });
    }
  };

  const saveEdit = (movie, fields) => {
    window.__fb.upsert(movie.id, fields)
      .then(() => { setEditing(null); showToast("Saved"); })
      .catch((e) => console.error(e));
  };

  const removeMovie = (movie) => {
    window.__fb.remove(movie.id)
      .then(() => { setEditing(null); setDetail(null); showToast("Removed: " + movie.title); })
      .catch((e) => console.error(e));
  };

  /* ---------- Derived ---------- */
  const availableGenres = useMemo(() => {
    const set = new Set();
    movies.forEach((m) => { m.genres.forEach((g) => set.add(g)); });
    return Array.from(set).sort();
  }, [movies]);

  const filtered = useMemo(() => {
    const list = movies.filter((m) => {
      // "All" is the static, shared library -- everything either of you has
      // added, unaffected by who's seen what. "Queue" is personal AND
      // curated: it's things *this* user explicitly wants to watch (queuedBy)
      // that they haven't seen yet. Marking something seen drops it from
      // their queue; it stays in the other person's queue until they've
      // seen it too.
      if (statusTab === "queue" && (!(m.queuedBy || []).includes(user) || m.seenBy.includes(user))) return false;
      if (statusTab === "seen_" + USERS[0] && !m.seenBy.includes(USERS[0])) return false;
      if (statusTab === "seen_" + USERS[1] && !m.seenBy.includes(USERS[1])) return false;
      if (statusTab === "both" && !USERS.every((u) => m.seenBy.includes(u))) return false;
      if (mediaFilter !== "all" && m.mediaType !== mediaFilter) return false;
      if (genreFilter !== "all" && !m.genres.includes(genreFilter)) return false;
      return true;
    });
    return list.slice().sort((a, b) => {
      if (sortBy === "rating") {
        const ra = averageRating(a);
        const rb = averageRating(b);
        if (ra === null && rb === null) return a.title.localeCompare(b.title);
        if (ra === null) return 1;
        if (rb === null) return -1;
        if (rb !== ra) return rb - ra;
        return a.title.localeCompare(b.title);
      }
      if (sortBy === "recent") return (b.addedAt || 0) - (a.addedAt || 0);
      return a.title.localeCompare(b.title); // "alpha", the default
    });
  }, [movies, statusTab, mediaFilter, genreFilter, user, sortBy]);

  const seenCount = (u) => movies.filter((m) => m.seenBy.includes(u)).length;

  if (!user) {
    return (
      <div className="picker">
        <h1>Who's watching?</h1>
        <div className="picker-row">
          {USERS.map((u) => (
            <button
              key={u}
              className="picker-card"
              style={{ borderColor: USER_COLORS[u] }}
              onClick={() => {
                setUser(u);
                try { localStorage.setItem("watchlist_user", u); } catch (e) {}
              }}
            >
              <div className="picker-avatar" style={{ background: USER_COLORS[u] }}>{u[0]}</div>
              {u}
            </button>
          ))}
        </div>
      </div>
    );
  }

  const statusTabs = [
    { id: "all", label: "All", color: "#F5F5F5" },
    { id: "queue", label: "Queue", color: "#F5F5F5" },
    { id: "seen_" + USERS[0], label: USERS[0] + "'s Seen", color: USER_COLORS[USERS[0]] },
    { id: "seen_" + USERS[1], label: USERS[1] + "'s Seen", color: USER_COLORS[USERS[1]] },
    { id: "both", label: "Both Seen", color: BOTH_SEEN_COLOR }
  ];

  return (
    <div className="app">
      <div className="header">
        <div className="header-spacer" />
        <h1>Watchlist</h1>
        <div className="header-right">
          <div className="user-chip">
            <div className="user-dot" style={{ background: USER_COLORS[user] }}>{user[0]}</div>
            {user}
          </div>
          <button
            className="switch-btn"
            onClick={() => {
              setUser(null);
              try { localStorage.removeItem("watchlist_user"); } catch (e) {}
            }}
          >
            switch
          </button>
        </div>
      </div>
      <div className="main-row">
        <div className="header-sub">
          {movies.length} titles {"\u00B7"} {seenCount(USERS[0])} seen by {USERS[0]} {"\u00B7"} {seenCount(USERS[1])} seen by {USERS[1]}
        </div>
        <div className="main-tabs">
          {[["watchlist", "Watchlist"], ["discover", "Discover"], ["afi", "AFI 100"], ["stats", "Stats"]].map(([id, label]) => (
            <button key={id} className={"main-tab" + (mainTab === id ? " active" : "")} onClick={() => setMainTab(id)}>
              {label}
            </button>
          ))}
        </div>
        <div className="main-row-spacer" />
      </div>

      {mainTab === "watchlist" && (
        <div>
          <div className="search-wrap">
            <input
              className="search-input"
              placeholder="Search TMDB to add a movie or show..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            {results.length > 0 && (
              <div className="search-results">
                {results.map((r) => {
                  const cardMovie = movies.find((m) => String(m.tmdbId) === String(r.id));
                  const inList = !!cardMovie;
                  return (
                    <div
                      key={r.media_type + r.id}
                      className="search-result"
                      style={{ cursor: "pointer" }}
                      onClick={() => {
                        if (inList) { setDetail(cardMovie); } else { setPreview({ result: r, mediaType: r.media_type, overrides: {} }); }
                        setQuery(""); setResults([]);
                      }}
                    >
                      {r.poster_path
                        ? <img className="search-thumb" src={IMG_SM + r.poster_path} alt="" />
                        : <div className="search-thumb" />}
                      <div className="search-info">
                        <div className="search-title">{resultTitle(r)}</div>
                        <div className="search-sub">
                          {(resultYear(r) || "?")} {"\u00B7"} {r.media_type === "tv" ? "TV" : "Movie"}
                          {r.vote_average ? " \u00B7 \u2605 " + r.vote_average.toFixed(1) : ""}
                        </div>
                      </div>
                      <button
                        className="add-btn"
                        disabled={inList}
                        onClick={(e) => { e.stopPropagation(); addResult(r); setQuery(""); setResults([]); }}
                      >
                        {inList ? "Added" : "+ Add"}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
            <button
              className="btn primary"
              style={{ padding: "8px 14px", fontSize: 13 }}
              onClick={spinRoulette}
            >
              {"\uD83C\uDFB2"} Roulette
            </button>
          </div>

          <div className="status-tabs">
            {statusTabs.map((t) => (
              <button
                key={t.id}
                className={"status-tab" + (statusTab === t.id ? " active" : "")}
                style={statusTab === t.id ? { background: t.color, borderColor: t.color } : { color: t.color === "#F5F5F5" ? "#ccc" : t.color }}
                onClick={() => setStatusTab(t.id)}
              >
                {t.label}
              </button>
            ))}
          </div>

          <div className="pill-row">
            <span className="pill-label">Format</span>
            <select className="field" style={{ width: "auto" }} value={mediaFilter} onChange={(e) => setMediaFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="movie">Films</option>
              <option value="tv">TV</option>
            </select>
            <span className="divider" />
            <span className="pill-label">Sort</span>
            <select className="field" style={{ width: "auto" }} value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
              <option value="alpha">Alphabetical</option>
              <option value="rating">Rating</option>
              <option value="recent">Recent</option>
            </select>
            {availableGenres.length > 0 && (
              <>
                <span className="divider" />
                <span className="pill-label">Genre</span>
                <select className="field" style={{ width: "auto" }} value={genreFilter} onChange={(e) => setGenreFilter(e.target.value)}>
                  <option value="all">All</option>
                  {availableGenres.map((g) => <option key={g} value={g}>{g}</option>)}
                </select>
              </>
            )}
          </div>

          {!synced && <div className="loading-line">Syncing with Firebase...</div>}
          {seeding && <div className="loading-line">First run: loading the seed list from TMDB... {seedProgress}/{SEED.length}</div>}
          {synced && !seeding && filtered.length === 0 && <div className="empty">Nothing here. Search above to add something.</div>}

          <div className="grid">
            {filtered.map((m) => (
              <MovieCard key={m.id} movie={m} user={user} onOpen={() => setDetail(m)} onToggleSeen={() => toggleSeen(m)} />
            ))}
          </div>
        </div>
      )}

      {mainTab === "discover" && (
        <Discover movies={movies} onAdd={addResult} user={user} onOpen={setDetail} onPreview={setPreview} />
      )}

      {mainTab === "afi" && (
        <AfiTab movies={movies} user={user} onAdd={addResult} onOpen={setDetail} onPreview={setPreview} afiData={afiData} afiProgress={afiProgress} />
      )}

      {mainTab === "stats" && (
        <StatsTab movies={movies} onOpen={setDetail} />
      )}

      {detail && (
        <DetailModal
          movie={movies.find((m) => m.id === detail.id) || detail}
          user={user}
          onClose={() => setDetail(null)}
          onToggleSeen={toggleSeen}
          onToggleQueued={toggleQueued}
          onRate={setRating}
          onEdit={(m) => { setDetail(null); setEditing(m); }}
          onOpenSimilar={openSimilarTitle}
        />
      )}

      {editing && (
        <EditModal
          movie={editing}
          user={user}
          onClose={() => setEditing(null)}
          onSave={saveEdit}
          onRemove={removeMovie}
        />
      )}

      {roulettePick && (
        <RouletteModal
          movie={movies.find((m) => m.id === roulettePick.id) || roulettePick}
          user={user}
          onClose={() => setRoulettePick(null)}
          onSpinAgain={spinRoulette}
          onToggleSeen={toggleSeen}
          onViewDetails={(m) => { setRoulettePick(null); setDetail(m); }}
        />
      )}

      {preview && (
        <PreviewModal
          result={preview.result}
          mediaType={preview.mediaType}
          user={user}
          seenByMe={movies.some((m) => String(m.tmdbId) === String(preview.result.id) && m.seenBy.includes(user))}
          onClose={() => setPreview(null)}
          onAddToQueue={() => { addResult(preview.result, preview.overrides); setPreview(null); }}
          onMarkSeen={() => { addResult(preview.result, preview.overrides, user); setPreview(null); }}
          onRate={(stars) => addAndRate(preview.result, preview.overrides, stars)}
          onOpenSimilar={openSimilarTitle}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ---------- Card ---------- */
function MovieCard({ movie, user, onOpen, onToggleSeen }) {
  const seen = movie.seenBy.includes(user);
  const myRating = movie.ratings[user] || 0;
  return (
    <div className="card" style={{ cursor: "pointer" }} onClick={onOpen}>
      <SeenDots movie={movie} />
      {movie.poster
        ? <img className="card-poster" src={movie.poster} alt={movie.title} loading="lazy" />
        : <div className="no-poster">{movie.title}</div>}
      <div className="card-body">
        <div className="card-title">{movie.title}</div>
        <div className="card-sub">
          <span>{movie.year || ""}</span>

          className={"seen-btn" + (seen ? " on" : "")}

/* ---------- Similar titles strip ---------- */
// Shown at the bottom of both the real detail view and the preview modal,
// so "more like this" works the same regardless of whether the title
// you're looking at is already in the watchlist. Pulls from TMDB's own
// /similar endpoint for whichever id+mediaType the modal is showing.
function SimilarTitles({ mediaType, tmdbId, onOpenTitle }) {
  const [similar, setSimilar] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    setSimilar([]);
    setLoaded(false);
    if (!tmdbId) { setLoaded(true); return; }
    let cancelled = false;
    const ep = mediaType === "tv" ? "tv" : "movie";
    tmdb("/" + ep + "/" + tmdbId + "/similar")
      .then((data) => {
        if (cancelled) return;
        setSimilar((data.results || []).filter((r) => r.poster_path).slice(0, 8));
      })
      .catch(() => {})
      .finally(() => { if (!cancelled) setLoaded(true); });
    return () => { cancelled = true; };
  }, [mediaType, tmdbId]);

  if (!tmdbId || (loaded && similar.length === 0)) return null;

  return (
    <div className="similar-section">
      <div className="similar-heading">More like this</div>
      {!loaded
        ? <div className="loading-line" style={{ padding: "8px 0", textAlign: "left" }}>Loading...</div>
        : (
          <div className="similar-strip">
            {similar.map((r) => (
              <div key={r.id} className="similar-item" onClick={() => onOpenTitle(r, mediaType)}>
                <img className="similar-poster" src={IMG_SM + r.poster_path} alt={resultTitle(r)} loading="lazy" />
                <div className="similar-title">{resultTitle(r)}</div>
              </div>
            ))}
          </div>
        )}
    </div>
  );
}

function EditModal({ movie, user, onClose, onSave, onRemove }) {
  const [category, setCategory] = useState(movie.category || "Movies");

  const [rating, setRatingLocal] = useState(movie.ratings[user] || 0);
  const [note, setNote] = useState(movie.notes[user] || "");

  const save = () => {
    const ratings = { ...movie.ratings };
    if (rating === 0) delete ratings[user]; else ratings[user] = rating;
    const notes = { ...movie.notes };
    if (!note.trim()) delete notes[user]; else notes[user] = note.trim();
    const seenBy = rating > 0 && !movie.seenBy.includes(user)
      ? movie.seenBy.concat(user)
      : movie.seenBy;
    onSave(movie, { category, streamer, ratings, notes, seenBy });

/* ---------- Discover tab ---------- */
function Discover({ movies, onAdd, user, onOpen, onPreview }) {
  const [genre, setGenre] = useState(0);
  const [streamer, setStreamer] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [error, setError] = useState("");
  // No-repeat shuffle bag, same idea as Roulette: every title shown for a
  // given genre+streamer combo gets marked off and excluded from the next
  // "Find Movies" click, so repeated searches don't keep surfacing the same
  // handful of popular titles. Keyed per filter combo -- switching genre or
  // streamer naturally starts a fresh bag for that combo. Once everything
  // matching has been shown, the bag for that combo clears and cycles again.
  const shownIds = useRef({});

  // Seen movies are filtered out entirely (they're not "discoveries" anymore).
  // Unseen movies already in the queue can still show up, but as "In watchlist"
  // rather than addable again.
  const watchedTmdbIds = new Set(movies.filter((m) => m.seenBy.length > 0).map((m) => m.tmdbId).filter(Boolean));
  const inWatchlistIds = new Set(movies.map((m) => m.tmdbId).filter(Boolean));
  const byTmdbId = new Map(movies.filter((m) => m.tmdbId).map((m) => [String(m.tmdbId), m]));

  const findMovies = async () => {
    setLoading(true);
    setSearched(true);
    setError("");
    setItems([]);
    try {
      const baseParams = {
        with_genres: genre || undefined,
        "vote_count.gte": 150,
        with_watch_providers: streamer ? PROVIDER_IDS[streamer] : undefined,
        watch_region: streamer ? "US" : undefined,
        sort_by: "popularity.desc",
        include_adult: false,
        language: "en-US"
      };
      // Page 1 tells us how deep this filter combo actually goes, so a narrow
      // genre+streamer combo doesn't waste requests on pages past the real end.
      const first = await tmdb("/discover/movie", { ...baseParams, page: 1 });
      const maxPage = Math.min(40, first.total_pages || 1);
      const pageNumbers = new Set([1]);
      // Sample more pages (8, up from 5) so the underlying candidate pool is
      // bigger -- a bigger pool means the no-repeat bag below takes longer
      // to exhaust and cycle, which is most of what "less repetitive" means.
      while (pageNumbers.size < Math.min(8, maxPage)) {
        pageNumbers.add(1 + Math.floor(Math.random() * maxPage));
      }
      const restPages = Array.from(pageNumbers).filter((p) => p !== 1);
      const rest = await Promise.all(restPages.map((p) => tmdb("/discover/movie", { ...baseParams, page: p })));
      const all = [first, ...rest].flatMap((p) => p.results || []);
      const seenIds = new Set();
      const unique = all.filter((r) => {
        if (seenIds.has(r.id) || !r.poster_path) return false;
        seenIds.add(r.id);
        return true;
      });
      const fresh = unique.filter((r) => !watchedTmdbIds.has(r.id));
      const shuffled = fresh.slice().sort(() => Math.random() - 0.5);
      // No score cutoff -- anything can show up, but stable-sort nudges
      // 5.0+ TMDB scores to the front while keeping the shuffle within each tier.
      const favored = shuffled.slice().sort((a, b) => {
        const aGood = (a.vote_average || 0) >= 5.0 ? 0 : 1;
        const bGood = (b.vote_average || 0) >= 5.0 ? 0 : 1;
        return aGood - bGood;
      });
      if (favored.length === 0) {
        setError("No new results. Everything matching is already in the watchlist. Try a different genre or streamer.");
      }

      const bagKey = genre + "|" + streamer;
      const alreadyShown = shownIds.current[bagKey] || new Set();
      let candidates = favored.filter((r) => !alreadyShown.has(r.id));
      if (candidates.length < 12) {
        // Running low on titles this combo hasn't shown yet -- start a fresh
        // round instead of just quietly returning fewer and fewer results.
        candidates = favored;
        shownIds.current[bagKey] = new Set();
      }
      const finalItems = candidates.slice(0, 12).map((r) => ({ ...r, media_type: "movie" }));
      const bag = shownIds.current[bagKey] || new Set();
      finalItems.forEach((r) => bag.add(r.id));
      shownIds.current[bagKey] = bag;

      setItems(finalItems);
    } catch (e) {
      setError("TMDB connection failed (" + e.message + "). Try again or adjust the filters.");
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="disc-panel">
        <div className="disc-field">
          <div className="disc-label">Genre</div>
          <select className="field" value={genre} onChange={(e) => setGenre(Number(e.target.value))}>
            <option value={0}>Any genre</option>
            {DISCOVER_GENRES.map(([id, label]) => <option key={id} value={id}>{label}</option>)}
          </select>
        </div>
        <div className="disc-field">
          <div className="disc-label">Streamer</div>
          <select className="field" value={streamer} onChange={(e) => setStreamer(e.target.value)}>
            <option value="">Any / Unknown</option>
            {STREAMERS.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <button className="btn primary" onClick={findMovies} disabled={loading} style={{ minWidth: 120 }}>
          {loading ? "Searching..." : "Find Movies"}
        </button>
      </div>

      {error && <div className="disc-error">{error}</div>}
      {loading && <div className="loading-line">Searching TMDB...</div>}
      {!loading && !searched && <div className="empty">Set your filters and find something new.</div>}

      <div className="grid">
        {items.map((r) => {
          const inList = inWatchlistIds.has(r.id);
          const cardMovie = byTmdbId.get(String(r.id));
          const seenByMe = cardMovie ? cardMovie.seenBy.includes(user) : false;
          return (
            <div
              key={r.id}
              className="card"
              style={{ cursor: "pointer" }}
              onClick={cardMovie ? () => onOpen(cardMovie) : () => onPreview({ result: r, mediaType: "movie", overrides: { streamer: streamer || "" } })}
            >
              {streamer && (
                <div className="rank-badge">
                  <span className="rank-pill" style={{ color: STREAMER_COLORS[streamer] || "#D2601A" }}>{streamer}</span>
                </div>
              )}
              {r.poster_path
                ? <img className="card-poster" src={IMG + r.poster_path} alt={resultTitle(r)} loading="lazy" />
                : <div className="no-poster">{resultTitle(r)}</div>}
              <div className="card-body">
                <div className="card-title">{resultTitle(r)}</div>
                <div className="card-sub">
                  <span>{resultYear(r) || ""}</span>
                  {r.vote_average ? <span>{"\u2605"} {r.vote_average.toFixed(1)}</span> : null}
                </div>
                <button
                  className="add-btn"
                  style={{ marginTop: "auto", padding: "7px 0" }}
                  disabled={inList}
                  onClick={(e) => {
                    e.stopPropagation();
                    onAdd(r, { streamer: streamer || "" });
                    setItems((prev) => prev.filter((x) => x.id !== r.id));
                  }}
                >
                  {inList ? "In watchlist" : "+ Add to queue"}
                </button>
                <button
                  className={"seen-btn" + (seenByMe ? " on" : "")}
                  style={seenByMe ? { background: USER_COLORS[user] } : null}
                  disabled={seenByMe}
                  onClick={(e) => {
                    e.stopPropagation();
                    onAdd(r, { streamer: streamer || "" }, user);
                    setItems((prev) => prev.filter((x) => x.id !== r.id));
                  }}
                >
                  {seenByMe ? "\u2713 Seen" : "Already seen it"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Stats tab ---------- */
// Everything here is computed from data already tracked (seenBy, ratings,

        <Stars value={averageRating(movie)} />
      </div>
    </div>

function StatsTab({ movies, onOpen }) {
  const stats = useMemo(() => {
    const seenCounts = {}, queuedCounts = {}, mediaSeenCounts = {}, runtimeMinutes = {};
    const ratingSum = {}, ratingCount = {}, genreSeenCount = {}, genreRatingSum = {};
    USERS.forEach((u) => {
      seenCounts[u] = 0; queuedCounts[u] = 0;
      mediaSeenCounts[u] = { movie: 0, tv: 0 };
      runtimeMinutes[u] = 0;
      ratingSum[u] = 0; ratingCount[u] = 0;
      genreSeenCount[u] = {}; genreRatingSum[u] = {};
    });
    let bothSeen = 0;
    movies.forEach((m) => {
      if (USERS.every((u) => m.seenBy.includes(u))) bothSeen++;
      USERS.forEach((u) => {
        if (m.seenBy.includes(u)) {
          seenCounts[u]++;
          mediaSeenCounts[u][m.mediaType === "tv" ? "tv" : "movie"]++;
          if (m.runtime) runtimeMinutes[u] += m.runtime;
          m.genres.forEach((g) => { genreSeenCount[u][g] = (genreSeenCount[u][g] || 0) + 1; });
        }
        if ((m.queuedBy || []).includes(u) && !m.seenBy.includes(u)) queuedCounts[u]++;
        const r = m.ratings[u];
        if (r) {
          ratingSum[u] += r; ratingCount[u]++;
          m.genres.forEach((g) => {
            const cur = genreRatingSum[u][g] || { sum: 0, count: 0 };
            cur.sum += r; cur.count++;
            genreRatingSum[u][g] = cur;
          });
        }
      });
    });

    const topGenres = {}, bestGenres = {};
    USERS.forEach((u) => {
      topGenres[u] = Object.entries(genreSeenCount[u]).sort((a, b) => b[1] - a[1]).slice(0, 5);
      bestGenres[u] = Object.entries(genreRatingSum[u])
        .filter(([, v]) => v.count >= 2) // need at least 2 ratings before a genre "average" means anything
        .map(([g, v]) => [g, v.sum / v.count])
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);
    });

    const topRated = movies
      .filter((m) => Object.keys(m.ratings || {}).length > 0)
      .slice()
      .sort((a, b) => averageRating(b) - averageRating(a))
      .slice(0, 5);

    const bothLoved = movies
      .filter((m) => USERS.every((u) => (m.ratings[u] || 0) >= 4))
      .slice()
      .sort((a, b) => averageRating(b) - averageRating(a))
      .slice(0, 5);

    return { total: movies.length, bothSeen, seenCounts, queuedCounts, mediaSeenCounts, runtimeMinutes, ratingSum, ratingCount, topGenres, bestGenres, topRated, bothLoved };
  }, [movies]);

  const fmtHours = (mins) => {
    if (!mins) return "0h";
    const h = Math.floor(mins / 60);
    const m = Math.round(mins % 60);
    return h + "h" + (m ? " " + m + "m" : "");
  };

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card">
          <div className="stat-number">{stats.total}</div>
          <div className="stat-label">Titles in the watchlist</div>
        </div>
        <div className="stat-card">
          <div className="stat-number" style={{ color: BOTH_SEEN_COLOR }}>{stats.bothSeen}</div>
          <div className="stat-label">Watched by both of you</div>
        </div>
        {USERS.map((u) => (
          <div key={u} className="stat-card">
            <div className="stat-number" style={{ color: USER_COLORS[u] }}>{stats.seenCounts[u]}</div>
            <div className="stat-label">Seen by {u} {"·"} {stats.queuedCounts[u]} queued</div>
          </div>
        ))}
      </div>

      <div className="stats-section">
        <div className="stats-heading">Time watched</div>
        <div className="stat-grid">
          {USERS.map((u) => (
            <div key={u} className="stat-card">
              <div className="stat-number" style={{ color: USER_COLORS[u] }}>{fmtHours(stats.runtimeMinutes[u])}</div>
              <div className="stat-label">{u} {"—"} {stats.mediaSeenCounts[u].movie} films, {stats.mediaSeenCounts[u].tv} shows</div>
            </div>
          ))}
        </div>
        <div className="stats-note">Based on runtime TMDB has for what's marked seen -- titles without a TMDB match aren't counted.</div>
      </div>

      <div className="stats-section">
        <div className="stats-heading">Ratings</div>
        <div className="stat-grid">
          {USERS.map((u) => (
            <div key={u} className="stat-card">
              <div className="stat-number" style={{ color: USER_COLORS[u] }}>
                {stats.ratingCount[u] > 0 ? (stats.ratingSum[u] / stats.ratingCount[u]).toFixed(1) : "—"}
              </div>
              <div className="stat-label">{u}'s average {"·"} {stats.ratingCount[u]} rated</div>
            </div>
          ))}
        </div>
      </div>

      <div className="stats-section">
        <div className="stats-heading">Genres watched most</div>
        <div className="stats-cols">
          {USERS.map((u) => (
            <div key={u} className="stats-col">
              <div className="stats-col-title" style={{ color: USER_COLORS[u] }}>{u}</div>
              {stats.topGenres[u].length === 0
                ? <div className="stats-empty">Nothing seen yet</div>
                : stats.topGenres[u].map(([g, n]) => (
                    <GenreBar key={g} label={g} barValue={n} barMax={stats.topGenres[u][0][1]} color={USER_COLORS[u]}
                      displayText={n + (n === 1 ? " title" : " titles")} />
                  ))}
            </div>
          ))}
        </div>
      </div>

      <div className="stats-section">
        <div className="stats-heading">Genres rated highest</div>
        <div className="stats-cols">
          {USERS.map((u) => (
            <div key={u} className="stats-col">
              <div className="stats-col-title" style={{ color: USER_COLORS[u] }}>{u}</div>
              {stats.bestGenres[u].length === 0
                ? <div className="stats-empty">Rate a couple more in the same genre to see this</div>
                : stats.bestGenres[u].map(([g, avg]) => (
                    <GenreBar key={g} label={g} barValue={avg} barMax={5} color={USER_COLORS[u]}
                      displayText={"★ " + avg.toFixed(1)} />
                  ))}
            </div>
          ))}
        </div>
      </div>

      {stats.bothLoved.length > 0 && (
        <div className="stats-section">
          <div className="stats-heading">You both loved</div>
          <div className="stats-list">
            {stats.bothLoved.map((m) => <StatsMovieRow key={m.id} movie={m} onOpen={onOpen} />)}
          </div>
        </div>
      )}

      {stats.topRated.length > 0 && (
        <div className="stats-section">
          <div className="stats-heading">Highest rated overall</div>
          <div className="stats-list">
            {stats.topRated.map((m) => <StatsMovieRow key={m.id} movie={m} onOpen={onOpen} />)}
          </div>
        </div>
      )}

      {stats.total === 0 && <div className="empty">Nothing in the watchlist yet.</div>}
    </div>
  );
}

/* ---------- AFI 100 tab ---------- */
function AfiTab({ movies, user, onAdd, onOpen, onPreview, afiData, afiProgress }) {
  const [listFilter, setListFilter] = useState("both");
  const [statusFilter, setStatusFilter] = useState("all");

  const rows = AFI_LIST
    .filter(([t, y, r98, r07]) => {
      if (listFilter === "1998" && !r98) return false;
      if (listFilter === "2007" && !r07) return false;
      return true;
    })
    .map(([t, y, r98, r07]) => {
      const key = slugId(t, y);
      const r = afiData[key];
      const inList = r ? movies.find((m) => String(m.tmdbId) === String(r.id)) : null;
      const sortRank = listFilter === "2007" ? r07 : listFilter === "1998" ? r98 : Math.min(r98 || 999, r07 || 999);
      return { t, y, r98, r07, key, r, inList, sortRank };
    })
    .filter((row) => {
      if (statusFilter === "missing" && row.inList) return false;
      // "Queued" means YOU queued it and haven't seen it -- not just "unseen by
      // anyone," which used to be the only signal before the Queue feature
      // tracked who actually asked to watch what.
      if (statusFilter === "queue" && !(row.inList && (row.inList.queuedBy || []).includes(user) && !row.inList.seenBy.includes(user))) return false;
      if (statusFilter === "seen" && !(row.inList && row.inList.seenBy.includes(user))) return false;
      return true;
    })
    .sort((a, b) => a.sortRank - b.sortRank);

  return (
    <div>
      <div className="pill-row">
        <span className="pill-label">List</span>
        {[["both", "Both Lists"], ["1998", "1998 Only"], ["2007", "2007 Only"]].map(([id, label]) => (
          <button key={id} className={"pill" + (listFilter === id ? " active" : "")} onClick={() => setListFilter(id)}>{label}</button>
        ))}
        <span className="divider" />
        <span className="pill-label">Status</span>
        {[["all", "All"], ["missing", "Not Added"], ["queue", "Queued"], ["seen", "Seen by me"]].map(([id, label]) => (
          <button key={id} className={"pill" + (statusFilter === id ? " active" : "")} onClick={() => setStatusFilter(id)}>{label}</button>
        ))}
      </div>
      {afiProgress < AFI_LIST.length && (
        <div className="afi-progress">
          Loading posters {afiProgress}/{AFI_LIST.length}...
        </div>
      )}
      <div className="grid">
        {rows.map(({ t, y, r98, r07, key, r, inList }) => (
          <div
            key={key}
            className="card"
            style={{ cursor: r ? "pointer" : "default" }}
            onClick={inList ? () => onOpen(inList) : (r ? () => onPreview({ result: { ...r, media_type: "movie" }, mediaType: "movie", overrides: { category: "AFI" } }) : undefined)}
          >
            <div className="rank-badge">
              {r98 ? <span className="rank-pill" style={{ color: "#D2601A" }}>#{r98} '98</span> : null}
              {r07 ? <span className="rank-pill" style={{ color: "#5B8DB8" }}>#{r07} '07</span> : null}
            </div>
            {inList && <SeenDots movie={inList} />}
            {r && r.poster_path
              ? <img className="card-poster" src={IMG + r.poster_path} alt={t} loading="lazy" />
              : <div className="no-poster">{t}</div>}
            <div className="card-body">
              <div className="card-title">{t}</div>
              <div className="card-sub">
                <span>{y}</span>
                {r && r.vote_average ? <span>{"\u2605"} {r.vote_average.toFixed(1)}</span> : null}
              </div>
              {inList
                ? <button className="seen-btn on" style={{ background: "#2a2a2a", color: "#aaa", cursor: "default" }}>
                    {inList.seenBy.includes(user)
                      ? "\u2713 Seen"
                      : (inList.queuedBy || []).includes(user) ? "Queued" : "In list"}
                  </button>
                : <button
                    className="add-btn"
                    style={{ marginTop: "auto", padding: "7px 0" }}
                    disabled={!r}
                    onClick={(e) => { e.stopPropagation(); r && onAdd({ ...r, media_type: "movie" }, { category: "AFI" }); }}
                  >
                    {r ? "+ Add to queue" : "Loading..."}
                  </button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
