<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0A0A0A; color: #F5F5F5; font-family: 'DM Sans', -apple-system, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0A0A0A; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  .app { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  .serif { font-family: 'Playfair Display', serif; }

  /* Profile picker */
  .picker { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .picker h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
  .picker-row { display: flex; gap: 24px; }
  .picker-card { width: 140px; height: 140px; border-radius: 12px; border: 2px solid #2a2a2a; background: #141414; color: #F5F5F5; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: transform 0.15s; }
  .picker-card:hover { transform: scale(1.05); }
  .picker-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #0A0A0A; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
  .header-sub { font-size: 10px; color: #666; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 8px; background: #141414; border: 1px solid #2a2a2a; border-radius: 20px; padding: 5px 12px 5px 6px; font-size: 13px; }
  .user-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0A0A0A; }
  .switch-btn { background: none; border: none; color: #888; font-size: 12px; text-decoration: underline; }

  /* Tabs */
  .main-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .main-tab { background: #141414; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; }
  .main-tab.active { background: #D2601A; border-color: #D2601A; color: #0A0A0A; }

  .status-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .status-tab { background: transparent; border: 1px solid #2a2a2a; color: #ccc; border-radius: 16px; padding: 5px 12px; font-size: 12.5px; }
  .status-tab.active { color: #0A0A0A; font-weight: 700; }

  .pill-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .pill-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
  .pill { background: transparent; border: 1px solid #2a2a2a; color: #bbb; border-radius: 14px; padding: 4px 11px; font-size: 12px; transition: all 0.15s; }
  .pill:hover { border-color: #D2601A; color: #D2601A; }
  .pill.active { background: #F5F5F5; border-color: #F5F5F5; color: #0A0A0A; font-weight: 600; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-input { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 10px; padding: 11px 14px; font-size: 15px; outline: none; }
  .search-input:focus { border-color: #D2601A; }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; margin-top: 6px; max-height: 380px; overflow-y: auto; z-index: 50; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .search-result { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; }
  .search-result:last-child { border-bottom: none; }
  .search-thumb { width: 36px; height: 54px; border-radius: 4px; object-fit: cover; background: #2a2a2a; flex-shrink: 0; }
  .search-info { flex: 1; min-width: 0; }
  .search-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-sub { font-size: 12px; color: #888; }
  .add-btn { background: #D2601A; border: none; color: #0A0A0A; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; flex-shrink: 0; transition: background 0.15s; }
  .add-btn:hover:not(:disabled) { background: #E17A3A; }
  .add-btn:disabled { background: #2a2a2a; color: #777; cursor: default; }

  /* Grid + cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.15s, border-color 0.15s; }
  .card:hover { border-color: #3a3a3a; transform: translateY(-2px); }
  .card-poster { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #1c1c1c; cursor: pointer; display: block; }
  .no-poster { width: 100%; aspect-ratio: 2 / 3; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; text-align: center; padding: 8px; cursor: pointer; background: #1c1c1c; font-family: 'Playfair Display', serif; }
  .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; line-height: 1.25; cursor: pointer; }
  .card-sub { font-size: 11.5px; color: #888; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid #2a2a2a; border-radius: 10px; padding: 1px 7px; font-size: 10.5px; color: #aaa; }
  .streamer-chip { border-radius: 10px; padding: 1px 7px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.6); }
  .seen-dots { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .seen-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0A0A0A; }
  .stars-line { font-size: 13px; letter-spacing: 1px; }
  .seen-btn { margin-top: auto; border-radius: 7px; border: 1px solid #2a2a2a; background: transparent; color: #ccc; padding: 6px 0; font-size: 12px; font-weight: 600; }
  .seen-btn.on { color: #0A0A0A; border-color: transparent; }
  .rank-badge { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 3px; z-index: 2; }
  .rank-pill { background: rgba(10,10,10,0.88); border-radius: 6px; padding: 1px 7px; font-size: 10px; font-weight: 700; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; backdrop-filter: blur(4px); }
  .modal { background: #141414; border: 1px solid #2a2a2a; border-radius: 14px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; }
  .modal-hero { display: flex; gap: 16px; padding: 18px; }
  .modal-poster { width: 140px; border-radius: 8px; flex-shrink: 0; align-self: flex-start; }
  .modal-main { flex: 1; min-width: 0; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .modal-tagline { font-family: 'Playfair Display', serif; font-size: 13px; color: #D2601A; font-style: italic; margin-bottom: 8px; }
  .modal-meta { font-size: 12.5px; color: #999; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-overview { font-size: 13.5px; line-height: 1.55; color: #ddd; margin-bottom: 12px; }
  .modal-section { padding: 0 18px 14px; }
  .modal-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .modal-label { font-size: 12px; color: #888; min-width: 78px; font-weight: 600; }
  .stars-input { font-size: 22px; letter-spacing: 3px; user-select: none; }
  .stars-input span { cursor: pointer; }
  .note-text { font-size: 13px; color: #ccc; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 10px; flex: 1; }
  .modal-actions { display: flex; gap: 8px; padding: 0 18px 18px; flex-wrap: wrap; }
  .btn { border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; border: 1px solid #2a2a2a; background: transparent; color: #F5F5F5; }

  .btn.danger { border-color: #6b2020; color: #e07a7a; }
  .close-x { position: sticky; top: 0; float: right; margin: 10px 10px 0 0; background: #2a2a2a; border: none; color: #F5F5F5; width: 30px; height: 30px; border-radius: 50%; font-size: 15px; z-index: 5; }

  .field { width: 100%; background: #0f0f0f; border: 1px solid #2a2a2a; color: #F5F5F5; border-radius: 8px; padding: 9px 11px; font-size: 14px; outline: none; }

  select.field option { background: #141414; }
  textarea.field { min-height: 80px; resize: vertical; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

  /* Discover */
  .disc-panel { background: #101010; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 18px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .disc-field { flex: 1; min-width: 140px; }
  .disc-label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .disc-error { background: #1a0d0d; border: 1px solid #3a1a1a; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #c98080; }
  input[type="range"] { width: 100%; height: 3px; appearance: none; -webkit-appearance: none; background: #2a2a2a; border-radius: 2px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #D2601A; cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: #D2601A; cursor: pointer; border: none; }

  .afi-progress { font-size: 12.5px; color: #888; margin-bottom: 12px; }
  .divider { width: 1px; height: 16px; background: #2a2a2a; }
  .empty { text-align: center; color: #666; padding: 60px 20px; font-size: 14px; font-family: 'Playfair Display', serif; font-style: italic; }
  .loading-line { text-align: center; color: #888; padding: 30px; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #141414; border: 1px solid #D2601A; color: #F5F5F5; border-radius: 10px; padding: 10px 18px; font-size: 13px; z-index: 200; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .modal-hero { flex-direction: column; }
    .modal-poster { width: 110px; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc,
    getDocs, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCIKytJXq6yFDGGShcbIGpViyrsU7wzR5U",
    authDomain: "tiffany-watchlist.firebaseapp.com",
    projectId: "tiffany-watchlist",
    storageBucket: "tiffany-watchlist.firebasestorage.app",
    messagingSenderId: "374560916921",
    appId: "1:374560916921:web:e65e997728a6fe6dc1a268"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const moviesCol = collection(db, "movies");
  const metaDoc = doc(db, "meta", "v1");

  window.__fb = {
    // Real-time listener. Callback receives a plain array of docs.
    onMovies(cb) {
      return onSnapshot(moviesCol, (snap) => {
        const docs = [];
        snap.forEach((d) => docs.push({ id: d.id, ...d.data() }));
        cb(docs);
      }, (err) => console.error("onMovies error:", err));
    },
    // setDoc with merge — NEVER updateDoc (updateDoc silently fails on missing docs).
    upsert(id, data) {
      return setDoc(doc(db, "movies", String(id)), data, { merge: true });
    },
    // Alias kept for API compatibility; identical merge semantics.
    update(id, data) {
      return setDoc(doc(db, "movies", String(id)), data, { merge: true });
    },
    remove(id) {
      return deleteDoc(doc(db, "movies", String(id)));
    },
    async getAll() {
      const snap = await getDocs(moviesCol);
      const docs = [];
      snap.forEach((d) => docs.push({ id: d.id, ...d.data() }));
      return docs;
    },
    async clearAll() {
      const snap = await getDocs(moviesCol);
      const deletions = [];
      snap.forEach((d) => deletions.push(deleteDoc(d.ref)));
      await Promise.all(deletions);
    },
    async getMeta() {
      const snap = await getDoc(metaDoc);
      return snap.exists() ? snap.data() : null;
    },
    setMeta(data) {
      return setDoc(metaDoc, data, { merge: true });
    },
    testWrite() {
      return setDoc(metaDoc, { lastTestWrite: Date.now() }, { merge: true });
    }
  };

  window.dispatchEvent(new Event("fb-ready"));
</script>

/* ---------- TMDB helpers ---------- */
async function tmdb(path, params) {
  const url = new URL("https://api.themoviedb.org/3" + path);
  if (params) Object.keys(params).forEach((k) => {
    if (params[k] !== undefined && params[k] !== null && params[k] !== "") url.searchParams.set(k, params[k]);
  });
  const res = await fetch(url, {
    headers: { Authorization: "Bearer " + TMDB_TOKEN, accept: "application/json" },
    signal: AbortSignal.timeout(6000)
  });
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
}

function slugId(title, year) {
  return (title + "_" + (year || "")).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function resultTitle(r) { return r.title || r.name || ""; }
function resultYear(r) {
  const d = r.release_date || r.first_air_date || "";
  return d ? parseInt(d.slice(0, 4), 10) : null;
}

/* Prefer the result whose release year actually matches; TMDB's first hit
   is sometimes a remake or a same-titled short. */
function pickByYear(results, year) {
  if (!results || results.length === 0) return null;
  if (!year) return results[0];
  return results.find((r) => (r.release_date || r.first_air_date || "").startsWith(String(year))) || results[0];
}

function buildDoc(result, details, overrides) {
  const mediaType = result.media_type === "tv" || result.first_air_date ? "tv" : "movie";
  const title = resultTitle(result);
  const year = resultYear(result);
  const genreIds = result.genre_ids || (details && details.genres ? details.genres.map((g) => g.id) : []);
  const genres = Array.from(new Set(genreIds.map((g) => GENRE_NAMES[g]).filter(Boolean)));
  const runtime = details
    ? (mediaType === "tv"
        ? (details.episode_run_time && details.episode_run_time[0]) || null
        : details.runtime || null)
    : null;
  return {
    id: result.id ? String(result.id) : slugId(title, year),
    tmdbId: result.id || null,
    title, year,
    poster: result.poster_path ? IMG + result.poster_path : null,
    genres,
    primaryGenre: genres[0] || null,
    tmdbRating: result.vote_average ? Math.round(result.vote_average * 10) / 10 : null,
    overview: result.overview || (details && details.overview) || "",
    tagline: (details && details.tagline) || "",
    runtime, mediaType,
    category: mediaType === "tv" ? "TV" : "Movies",
    seenBy: [], ratings: {}, notes: {},
    streamer: "", addedAt: Date.now(),
    ...(overrides || {})
  };
}

async function searchAndBuild(seed) {
  const ep = seed.mediaType === "tv" ? "tv" : "movie";
  try {
    const params = { query: seed.title };
    if (seed.year) {
      if (ep === "tv") params.first_air_date_year = seed.year;
      else params.year = seed.year;
    }
    const data = await tmdb("/search/" + ep, params);
    const hit = pickByYear(data.results, seed.year);
    if (hit) {
      let details = null;
      try { details = await tmdb("/" + ep + "/" + hit.id); } catch (e) { /* details are nice-to-have */ }
      return buildDoc({ ...hit, media_type: ep }, details, { category: seed.category });
    }
  } catch (e) { console.warn("TMDB search failed for", seed.title, e); }
  // Fallback: title_year slug key so the app still works without a TMDB match
  return {
    id: slugId(seed.title, seed.year), tmdbId: null, title: seed.title, year: seed.year || null,
    poster: null, genres: [], primaryGenre: null, tmdbRating: null,
    overview: "", tagline: "", runtime: null, mediaType: seed.mediaType || "movie",
    category: seed.category || "Movies", seenBy: [], ratings: {}, notes: {},
    streamer: "", addedAt: Date.now()
  };
}

function normalize(d) {
  return {
    ...d,
    seenBy: Array.isArray(d.seenBy) ? d.seenBy : [],
    ratings: d.ratings && typeof d.ratings === "object" ? d.ratings : {},
    notes: d.notes && typeof d.notes === "object" ? d.notes : {},
    genres: Array.isArray(d.genres) ? d.genres : [],
    category: d.category === "Tiffany" ? "Movies" : (d.category || "Movies"),
    mediaType: d.mediaType || "movie"
  };
}

function SeenDots({ movie }) {
  const bothSeen = USERS.every((u) => movie.seenBy.includes(u));

    <div className="seen-dots">

        <div className="seen-dot" style={{ background: BOTH_SEEN_COLOR }} title="Both seen" />

        USERS.filter((u) => movie.seenBy.includes(u)).map((u) => (
          <div key={u} className="seen-dot" style={{ background: USER_COLORS[u] }} title={u + " has seen this"} />
        ))
      )}
    </div>
  );
}

/* ---------- Main App ---------- */
function App() {
  const [fbReady, setFbReady] = useState(!!window.__fb);
  const [user, setUser] = useState(() => {
    try {
      const saved = localStorage.getItem("watchlist_user");
      return USERS.includes(saved) ? saved : null;
    } catch (e) { return null; }
  });
  const [movies, setMovies] = useState([]);
  const [synced, setSynced] = useState(false);
  const [seeding, setSeeding] = useState(false);
  const [seedProgress, setSeedProgress] = useState(0);
  const [mainTab, setMainTab] = useState("watchlist");
  const [statusTab, setStatusTab] = useState("all");
  const [mediaFilter, setMediaFilter] = useState("all");
  const [categoryFilter, setCategoryFilter] = useState("all");
  const [genreFilter, setGenreFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [detail, setDetail] = useState(null);
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);

  const moviesRef = useRef([]);
  const migrationRan = useRef(false);
  const seedRan = useRef(false);
  const searchTimer = useRef(null);
  moviesRef.current = movies;

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  /* Wait for the Firebase module script */
  useEffect(() => {
    if (window.__fb) { setFbReady(true); return; }
    const onReady = () => setFbReady(true);
    window.addEventListener("fb-ready", onReady);
    return () => window.removeEventListener("fb-ready", onReady);
  }, []);

  /* Real-time sync. Callback is SYNCHRONOUS — no awaits inside onSnapshot. */
  useEffect(() => {
    if (!fbReady) return;
    const unsub = window.__fb.onMovies((docs) => {
      const byKey = {};
      const dupes = [];
      docs.forEach((d) => {
        const key = d.tmdbId ? String(d.tmdbId) : String(d.id);
        const existing = byKey[key];
        if (!existing) { byKey[key] = d; return; }
        // Prefer the shorter doc id (stable TMDB-id keys beat legacy slugs)
        if (String(d.id).length < String(existing.id).length) {
          dupes.push(existing.id);
          byKey[key] = d;
        } else {
          dupes.push(d.id);
        }
      });
      // Fire-and-forget dupe deletion — never await inside this callback
      dupes.forEach((id) => { window.__fb.remove(id).catch(() => {}); });
      const list = Object.values(byKey).map(normalize);
      list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
      setMovies(list);
      setSynced(true);
    });
    return unsub;
  }, [fbReady]);

  /* One-time migration: clear preset seenBy where every user is marked seen */
  useEffect(() => {
    if (!synced || migrationRan.current) return;
    migrationRan.current = true;
    window.__fb.getMeta().then((meta) => {
      if (meta && meta.seenCleared) return null;
      const toClear = moviesRef.current.filter((m) => USERS.every((u) => m.seenBy.includes(u)));
      return Promise.all(toClear.map((m) => window.__fb.upsert(m.id, { seenBy: [] })))
        .then(() => window.__fb.setMeta({ seenCleared: true }));
    }).catch((e) => console.error("Migration error:", e));
  }, [synced]);

  /* Seed when Firestore is completely empty: batches of 5, 250ms apart */
  useEffect(() => {
    if (!synced || seedRan.current || moviesRef.current.length > 0) return;
    seedRan.current = true;
    setSeeding(true);
    (async () => {
      for (let i = 0; i < SEED.length; i += 5) {
        const batch = SEED.slice(i, i + 5);
        const built = await Promise.all(batch.map((s) => searchAndBuild(s)));
        await Promise.all(built.map((doc) => window.__fb.upsert(doc.id, doc)));
        setSeedProgress(Math.min(i + 5, SEED.length));
        if (i + 5 < SEED.length) await new Promise((r) => setTimeout(r, 250));
      }
    })().catch((e) => console.error("Seed error:", e)).finally(() => setSeeding(false));
  }, [synced]);

  /* Debounced TMDB search */
  useEffect(() => {
    if (searchTimer.current) clearTimeout(searchTimer.current);
    if (!query.trim()) { setResults([]); return; }
    searchTimer.current = setTimeout(async () => {
      try {
        const data = await tmdb("/search/multi", { query: query.trim() });
        setResults((data.results || [])
          .filter((r) => r.media_type === "movie" || r.media_type === "tv")
          .slice(0, 8));
      } catch (e) { console.warn("Search failed:", e); }
    }, 350);
    return () => { if (searchTimer.current) clearTimeout(searchTimer.current); };
  }, [query]);

  /* ---------- Actions (all writes go through upsert = setDoc merge) ---------- */
  const toggleSeen = (movie) => {
    const has = movie.seenBy.includes(user);
    const seenBy = has ? movie.seenBy.filter((u) => u !== user) : movie.seenBy.concat(user);
    window.__fb.upsert(movie.id, { seenBy }).catch((e) => console.error(e));
    if (detail && detail.id === movie.id) setDetail({ ...detail, seenBy });
  };

  const setRating = (movie, stars) => {
    const ratings = { ...movie.ratings };
    if (stars === 0) delete ratings[user]; else ratings[user] = stars;
    const seenBy = stars > 0 && !movie.seenBy.includes(user)
      ? movie.seenBy.concat(user)
      : movie.seenBy;
    window.__fb.upsert(movie.id, { ratings, seenBy }).catch((e) => console.error(e));
    if (detail && detail.id === movie.id) setDetail({ ...detail, ratings, seenBy });
  };

  const addResult = async (result, overrides) => {
    const existing = movies.find((m) => String(m.tmdbId) === String(result.id));
    if (existing) { showToast("Already in the watchlist"); return; }
    let details = null;
    try {
      const path = (result.media_type === "tv" ? "/tv/" : "/movie/") + result.id;
      details = await tmdb(path);
    } catch (e) { /* fine without details */ }
    const doc = buildDoc(result, details, overrides);
    await window.__fb.upsert(doc.id, doc);
    showToast("Added: " + doc.title);
  };

  const saveEdit = (movie, fields) => {
    window.__fb.upsert(movie.id, fields)
      .then(() => { setEditing(null); showToast("Saved"); })
      .catch((e) => console.error(e));
  };

  const removeMovie = (movie) => {
    window.__fb.remove(movie.id)
      .then(() => { setEditing(null); setDetail(null); showToast("Removed: " + movie.title); })
      .catch((e) => console.error(e));
  };

  /* ---------- Derived ---------- */
  const availableGenres = useMemo(() => {
    const set = new Set();
    movies.forEach((m) => { m.genres.forEach((g) => set.add(g)); });
    return Array.from(set).sort();
  }, [movies]);

  const filtered = useMemo(() => {
    return movies.filter((m) => {
      // Both "All" and "Queue" hide what *this* user has already seen -- it's
      // still visible to the other person until they've seen it too.
      if ((statusTab === "all" || statusTab === "queue") && m.seenBy.includes(user)) return false;
      if (statusTab === "seen_" + USERS[0] && !m.seenBy.includes(USERS[0])) return false;
      if (statusTab === "seen_" + USERS[1] && !m.seenBy.includes(USERS[1])) return false;
      if (statusTab === "both" && !USERS.every((u) => m.seenBy.includes(u))) return false;
      if (mediaFilter !== "all" && m.mediaType !== mediaFilter) return false;
      if (categoryFilter !== "all" && m.category !== categoryFilter) return false;
      if (genreFilter !== "all" && !m.genres.includes(genreFilter)) return false;
      return true;
    });
  }, [movies, statusTab, mediaFilter, categoryFilter, genreFilter, user]);

  const seenCount = (u) => movies.filter((m) => m.seenBy.includes(u)).length;

  if (!user) {
    return (
      <div className="picker">
        <h1>Who's watching?</h1>
        <div className="picker-row">
          {USERS.map((u) => (
            <button
              key={u}
              className="picker-card"
              style={{ borderColor: USER_COLORS[u] }}
              onClick={() => {
                setUser(u);
                try { localStorage.setItem("watchlist_user", u); } catch (e) {}
              }}
            >
              <div className="picker-avatar" style={{ background: USER_COLORS[u] }}>{u[0]}</div>
              {u}
            </button>
          ))}
        </div>
      </div>
    );
  }

  const statusTabs = [
    { id: "all", label: "All", color: "#F5F5F5" },
    { id: "queue", label: "Queue", color: "#F5F5F5" },
    { id: "seen_" + USERS[0], label: USERS[0] + "'s Seen", color: USER_COLORS[USERS[0]] },
    { id: "seen_" + USERS[1], label: USERS[1] + "'s Seen", color: USER_COLORS[USERS[1]] },
    { id: "both", label: "Both Seen", color: BOTH_SEEN_COLOR }
  ];

  return (
    <div className="app">
      <div className="header">
        <h1>Watchlist</h1>
        <div className="header-right">
          <div className="user-chip">
            <div className="user-dot" style={{ background: USER_COLORS[user] }}>{user[0]}</div>
            {user}
          </div>
          <button
            className="switch-btn"
            onClick={() => {
              setUser(null);
              try { localStorage.removeItem("watchlist_user"); } catch (e) {}
            }}
          >
            switch
          </button>
        </div>
      </div>
      <div className="header-sub">
        {movies.length} titles {"\u00B7"} {seenCount(USERS[0])} seen by {USERS[0]} {"\u00B7"} {seenCount(USERS[1])} seen by {USERS[1]}
      </div>

      <div className="main-tabs">
        {[["watchlist", "Watchlist"], ["discover", "Discover"], ["afi", "AFI 100"]].map(([id, label]) => (
          <button key={id} className={"main-tab" + (mainTab === id ? " active" : "")} onClick={() => setMainTab(id)}>
            {label}
          </button>
        ))}
      </div>

      {mainTab === "watchlist" && (
        <div>
          <div className="search-wrap">
            <input
              className="search-input"
              placeholder="Search TMDB to add a movie or show..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            {results.length > 0 && (
              <div className="search-results">
                {results.map((r) => {
                  const inList = movies.some((m) => String(m.tmdbId) === String(r.id));
                  return (
                    <div key={r.media_type + r.id} className="search-result">
                      {r.poster_path
                        ? <img className="search-thumb" src={IMG_SM + r.poster_path} alt="" />
                        : <div className="search-thumb" />}
                      <div className="search-info">
                        <div className="search-title">{resultTitle(r)}</div>
                        <div className="search-sub">
                          {(resultYear(r) || "?")} {"\u00B7"} {r.media_type === "tv" ? "TV" : "Movie"}
                          {r.vote_average ? " \u00B7 \u2605 " + r.vote_average.toFixed(1) : ""}
                        </div>
                      </div>
                      <button
                        className="add-btn"
                        disabled={inList}
                        onClick={() => { addResult(r); setQuery(""); setResults([]); }}
                      >
                        {inList ? "Added" : "+ Add"}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div className="status-tabs">
            {statusTabs.map((t) => (
              <button
                key={t.id}
                className={"status-tab" + (statusTab === t.id ? " active" : "")}
                style={statusTab === t.id ? { background: t.color, borderColor: t.color } : { color: t.color === "#F5F5F5" ? "#ccc" : t.color }}
                onClick={() => setStatusTab(t.id)}
              >
                {t.label}
              </button>
            ))}
          </div>

          <div className="pill-row">
            <span className="pill-label">Format</span>
            {[["all", "All"], ["movie", "Films"], ["tv", "TV"]].map(([id, label]) => (
              <button key={id} className={"pill" + (mediaFilter === id ? " active" : "")} onClick={() => setMediaFilter(id)}>{label}</button>
            ))}
          </div>
          <div className="pill-row">
            <span className="pill-label">Category</span>
            <button className={"pill" + (categoryFilter === "all" ? " active" : "")} onClick={() => setCategoryFilter("all")}>All</button>
            {CATEGORIES.map((c) => (
              <button key={c} className={"pill" + (categoryFilter === c ? " active" : "")} onClick={() => setCategoryFilter(c)}>{c}</button>
            ))}
          </div>
          {availableGenres.length > 0 && (
            <div className="pill-row">
              <span className="pill-label">Genre</span>
              <button className={"pill" + (genreFilter === "all" ? " active" : "")} onClick={() => setGenreFilter("all")}>All</button>
              {availableGenres.map((g) => (
                <button key={g} className={"pill" + (genreFilter === g ? " active" : "")} onClick={() => setGenreFilter(g)}>{g}</button>
              ))}
            </div>
          )}

          {!synced && <div className="loading-line">Syncing with Firebase...</div>}
          {seeding && <div className="loading-line">First run: loading the seed list from TMDB... {seedProgress}/{SEED.length}</div>}
          {synced && !seeding && filtered.length === 0 && <div className="empty">Nothing here. Search above to add something.</div>}

          <div className="grid">
            {filtered.map((m) => (
              <MovieCard key={m.id} movie={m} user={user} onOpen={() => setDetail(m)} onToggleSeen={() => toggleSeen(m)} />
            ))}
          </div>
        </div>
      )}

      {mainTab === "discover" && (
        <Discover movies={movies} onAdd={addResult} />
      )}

      {mainTab === "afi" && (
        <AfiTab movies={movies} user={user} onAdd={addResult} onOpen={setDetail} />
      )}

      {detail && (
        <DetailModal
          movie={movies.find((m) => m.id === detail.id) || detail}
          user={user}
          onClose={() => setDetail(null)}
          onToggleSeen={toggleSeen}
          onRate={setRating}
          onEdit={(m) => { setDetail(null); setEditing(m); }}
        />
      )}

      {editing && (
        <EditModal
          movie={editing}
          user={user}
          onClose={() => setEditing(null)}
          onSave={saveEdit}
          onRemove={removeMovie}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ---------- Card ---------- */
function MovieCard({ movie, user, onOpen, onToggleSeen }) {
  const seen = movie.seenBy.includes(user);
  const myRating = movie.ratings[user] || 0;
  return (
    <div className="card">
      <SeenDots movie={movie} />
      {movie.poster
        ? <img className="card-poster" src={movie.poster} alt={movie.title} onClick={onOpen} loading="lazy" />
        : <div className="no-poster" onClick={onOpen}>{movie.title}</div>}
      <div className="card-body">
        <div className="card-title" onClick={onOpen}>{movie.title}</div>
        <div className="card-sub">
          <span>{movie.year || ""}</span>
          {movie.category ? <span className="chip">{movie.category}</span> : null}
          {movie.streamer
            ? <span className="streamer-chip" style={{ color: STREAMER_COLORS[movie.streamer] || "#D2601A" }}>{movie.streamer}</span>
            : null}
        </div>
        {myRating > 0 && <Stars value={myRating} />}
        <button
          className={"seen-btn" + (seen ? " on" : "")}
          style={seen ? { background: USER_COLORS[user] } : null}
          onClick={onToggleSeen}
        >
          {seen ? "\u2713 Seen" : "Mark Seen"}
        </button>
      </div>
    </div>
  );
}

/* ---------- Detail modal ---------- */
function DetailModal({ movie, user, onClose, onToggleSeen, onRate, onEdit }) {
  const seen = movie.seenBy.includes(user);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>{"\u2715"}</button>
        <div className="modal-hero">
          {movie.poster && <img className="modal-poster" src={movie.poster} alt={movie.title} />}
          <div className="modal-main">
            <div className="modal-title">{movie.title} {movie.year ? "(" + movie.year + ")" : ""}</div>
            {movie.tagline ? <div className="modal-tagline">{movie.tagline}</div> : null}
            <div className="modal-meta">
              {movie.mediaType === "tv" ? <span>TV</span> : <span>Film</span>}
              {movie.runtime ? <span>{movie.runtime} min</span> : null}
              {movie.tmdbRating ? <span>{"\u2605"} {movie.tmdbRating} TMDB</span> : null}
              {movie.streamer ? <span style={{ color: STREAMER_COLORS[movie.streamer] || "#D2601A", fontWeight: 700 }}>{movie.streamer}</span> : null}
            </div>
            {movie.genres.length > 0 && (
              <div className="modal-meta">{movie.genres.map((g) => <span key={g} className="chip">{g}</span>)}</div>
            )}
            {movie.overview ? <div className="modal-overview">{movie.overview}</div> : null}
            <button
              className={"seen-btn" + (seen ? " on" : "")}
              style={{ padding: "8px 16px", ...(seen ? { background: USER_COLORS[user] } : {}) }}
              onClick={() => onToggleSeen(movie)}
            >
              {seen ? "\u2713 Seen by " + user : "Mark Seen"}
            </button>
          </div>
        </div>
        <div className="modal-section">
          {USERS.map((u) => (
            <div key={u} className="modal-row">
              <span className="modal-label" style={{ color: USER_COLORS[u] }}>{u}</span>
              <Stars value={movie.ratings[u] || 0} onSet={u === user ? (n) => onRate(movie, n) : null} />
              {movie.seenBy.includes(u) && <span className="chip" style={{ borderColor: USER_COLORS[u], color: USER_COLORS[u] }}>seen</span>}
            </div>
          ))}
          {USERS.map((u) => movie.notes[u] ? (
            <div key={u + "_note"} className="modal-row">
              <span className="modal-label" style={{ color: USER_COLORS[u] }}>{u}'s note</span>
              <div className="note-text">{movie.notes[u]}</div>
            </div>
          ) : null)}
        </div>
        <div className="modal-actions">
          <button className="btn primary" onClick={() => onEdit(movie)}>Edit</button>
          <button className="btn" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Edit modal ---------- */
function EditModal({ movie, user, onClose, onSave, onRemove }) {
  const [category, setCategory] = useState(movie.category || "Movies");
  const [streamer, setStreamer] = useState(movie.streamer || "");
  const [rating, setRatingLocal] = useState(movie.ratings[user] || 0);
  const [note, setNote] = useState(movie.notes[user] || "");

  const save = () => {
    const ratings = { ...movie.ratings };
    if (rating === 0) delete ratings[user]; else ratings[user] = rating;
    const notes = { ...movie.notes };
    if (!note.trim()) delete notes[user]; else notes[user] = note.trim();
    const seenBy = rating > 0 && !movie.seenBy.includes(user)
      ? movie.seenBy.concat(user)
      : movie.seenBy;
    onSave(movie, { category, streamer, ratings, notes, seenBy });
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 460 }}>
        <div style={{ padding: 20 }}>
          <div className="modal-title" style={{ marginBottom: 16 }}>Edit: {movie.title}</div>
          <div className="form-row">
            <label>Category</label>
            <select className="field" value={category} onChange={(e) => setCategory(e.target.value)}>
              {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-row">
            <label>Streamer</label>
            <select className="field" value={streamer} onChange={(e) => setStreamer(e.target.value)}>
              <option value="">None</option>
              {STREAMERS.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="form-row">
            <label>Your rating ({user})</label>
            <Stars value={rating} onSet={setRatingLocal} />
          </div>
          <div className="form-row">
            <label>Your note ({user})</label>
            <textarea className="field" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Thoughts, who recommended it, etc." />
          </div>
          <div className="modal-actions" style={{ padding: 0, marginTop: 6 }}>
            <button className="btn primary" onClick={save}>Save</button>
            <button className="btn" onClick={onClose}>Cancel</button>
            <button className="btn danger" style={{ marginLeft: "auto" }} onClick={() => onRemove(movie)}>Remove</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Discover tab ---------- */
function Discover({ movies, onAdd }) {
  const [genre, setGenre] = useState(0);
  const [streamer, setStreamer] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [error, setError] = useState("");

  // Seen movies are filtered out entirely (they're not "discoveries" anymore).
  // Unseen movies already in the queue can still show up, but as "In watchlist"
  // rather than addable again.
  const watchedTmdbIds = new Set(movies.filter((m) => m.seenBy.length > 0).map((m) => m.tmdbId).filter(Boolean));
  const inWatchlistIds = new Set(movies.map((m) => m.tmdbId).filter(Boolean));

  const findMovies = async () => {
    setLoading(true);
    setSearched(true);
    setError("");
    setItems([]);
    try {
      const startPage = 1 + Math.floor(Math.random() * 6);
      const pages = await Promise.all(
        [startPage, startPage + 1, startPage + 2].map((p) =>
          tmdb("/discover/movie", {
            with_genres: genre || undefined,
            "vote_count.gte": 150,
            with_watch_providers: streamer ? PROVIDER_IDS[streamer] : undefined,
            watch_region: streamer ? "US" : undefined,
            sort_by: "popularity.desc",
            include_adult: false,
            language: "en-US",
            page: p
          })
        )
      );
      const all = pages.flatMap((p) => p.results || []);
      const seenIds = new Set();
      const unique = all.filter((r) => {
        if (seenIds.has(r.id) || !r.poster_path) return false;
        seenIds.add(r.id);
        return true;
      });
      const fresh = unique.filter((r) => !watchedTmdbIds.has(r.id));
      const shuffled = fresh.slice().sort(() => Math.random() - 0.5);
      // No score cutoff -- anything can show up, but stable-sort nudges
      // 5.0+ TMDB scores to the front while keeping the shuffle within each tier.
      const favored = shuffled.slice().sort((a, b) => {
        const aGood = (a.vote_average || 0) >= 5.0 ? 0 : 1;
        const bGood = (b.vote_average || 0) >= 5.0 ? 0 : 1;
        return aGood - bGood;
      });
      if (favored.length === 0) {
        setError("No new results. Everything matching is already in the watchlist. Try a different genre or streamer.");
      }
      setItems(favored.slice(0, 12).map((r) => ({ ...r, media_type: "movie" })));
    } catch (e) {
      setError("TMDB connection failed (" + e.message + "). Try again or adjust the filters.");
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="disc-panel">
        <div className="disc-field">
          <div className="disc-label">Genre</div>
          <select className="field" value={genre} onChange={(e) => setGenre(Number(e.target.value))}>
            <option value={0}>Any genre</option>
            {DISCOVER_GENRES.map(([id, label]) => <option key={id} value={id}>{label}</option>)}
          </select>
        </div>
        <div className="disc-field">
          <div className="disc-label">Streamer</div>
          <select className="field" value={streamer} onChange={(e) => setStreamer(e.target.value)}>
            <option value="">Any / Unknown</option>
            {STREAMERS.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
        <button className="btn primary" onClick={findMovies} disabled={loading} style={{ minWidth: 120 }}>
          {loading ? "Searching..." : "Find Movies"}
        </button>
      </div>

      {error && <div className="disc-error">{error}</div>}
      {loading && <div className="loading-line">Searching TMDB...</div>}
      {!loading && !searched && <div className="empty">Set your filters and find something new.</div>}

      <div className="grid">
        {items.map((r) => {
          const inList = inWatchlistIds.has(r.id);
          return (
            <div key={r.id} className="card">
              {streamer && (
                <div className="rank-badge">
                  <span className="rank-pill" style={{ color: STREAMER_COLORS[streamer] || "#D2601A" }}>{streamer}</span>
                </div>
              )}
              {r.poster_path
                ? <img className="card-poster" src={IMG + r.poster_path} alt={resultTitle(r)} loading="lazy" />
                : <div className="no-poster">{resultTitle(r)}</div>}
              <div className="card-body">
                <div className="card-title">{resultTitle(r)}</div>
                <div className="card-sub">
                  <span>{resultYear(r) || ""}</span>
                  {r.vote_average ? <span>{"\u2605"} {r.vote_average.toFixed(1)}</span> : null}
                </div>
                <button
                  className="add-btn"
                  style={{ marginTop: "auto", padding: "7px 0" }}
                  disabled={inList}
                  onClick={() => {
                    onAdd(r, { streamer: streamer || "" });
                    setItems((prev) => prev.filter((x) => x.id !== r.id));
                  }}
                >
                  {inList ? "In watchlist" : "+ Add to queue"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- AFI 100 tab ---------- */
function AfiTab({ movies, user, onAdd, onOpen }) {
  const [afiData, setAfiData] = useState({});   // slug -> tmdb search result
  const [progress, setProgress] = useState(0);
  const [listFilter, setListFilter] = useState("both");
  const [statusFilter, setStatusFilter] = useState("all");
  const loadStarted = useRef(false);

  /* Batch-resolve AFI titles against TMDB: 5 at a time, 250ms between batches */
  useEffect(() => {
    if (loadStarted.current) return;
    loadStarted.current = true;
    (async () => {
      for (let i = 0; i < AFI_LIST.length; i += 5) {
        const batch = AFI_LIST.slice(i, i + 5);
        const found = await Promise.all(batch.map(async ([t, y]) => {
          try {
            const data = await tmdb("/search/movie", { query: t, year: y });
            return [slugId(t, y), pickByYear(data.results, y)];
          } catch (e) { return [slugId(t, y), null]; }
        }));
        setAfiData((prev) => {
          const next = { ...prev };
          found.forEach(([key, r]) => { if (r) next[key] = r; });
          return next;
        });
        setProgress(Math.min(i + 5, AFI_LIST.length));
        if (i + 5 < AFI_LIST.length) await new Promise((res) => setTimeout(res, 250));
      }
      setProgress(AFI_LIST.length);
    })().catch((e) => console.warn("AFI load error:", e));
  }, []);

  const rows = AFI_LIST
    .filter(([t, y, r98, r07]) => {
      if (listFilter === "1998" && !r98) return false;
      if (listFilter === "2007" && !r07) return false;
      return true;
    })
    .map(([t, y, r98, r07]) => {
      const key = slugId(t, y);
      const r = afiData[key];
      const inList = r ? movies.find((m) => String(m.tmdbId) === String(r.id)) : null;
      const sortRank = listFilter === "2007" ? r07 : listFilter === "1998" ? r98 : Math.min(r98 || 999, r07 || 999);
      return { t, y, r98, r07, key, r, inList, sortRank };
    })
    .filter((row) => {
      if (statusFilter === "missing" && row.inList) return false;
      if (statusFilter === "queue" && !(row.inList && row.inList.seenBy.length === 0)) return false;
      if (statusFilter === "seen" && !(row.inList && row.inList.seenBy.includes(user))) return false;
      return true;
    })
    .sort((a, b) => a.sortRank - b.sortRank);

  return (
    <div>
      <div className="pill-row">
        <span className="pill-label">List</span>
        {[["both", "Both Lists"], ["1998", "1998 Only"], ["2007", "2007 Only"]].map(([id, label]) => (
          <button key={id} className={"pill" + (listFilter === id ? " active" : "")} onClick={() => setListFilter(id)}>{label}</button>
        ))}
        <span className="divider" />
        <span className="pill-label">Status</span>
        {[["all", "All"], ["missing", "Not Added"], ["queue", "Queued"], ["seen", "Seen by me"]].map(([id, label]) => (
          <button key={id} className={"pill" + (statusFilter === id ? " active" : "")} onClick={() => setStatusFilter(id)}>{label}</button>
        ))}
      </div>
      <div className="afi-progress">
        Combined 1998 + 2007 lists {"\u00B7"} {AFI_LIST.length} films, deduped
        {progress < AFI_LIST.length ? " \u00B7 loading posters " + progress + "/" + AFI_LIST.length + "..." : ""}
      </div>
      <div className="grid">
        {rows.map(({ t, y, r98, r07, key, r, inList }) => (
          <div key={key} className="card">
            <div className="rank-badge">
              {r98 ? <span className="rank-pill" style={{ color: "#D2601A" }}>#{r98} '98</span> : null}
              {r07 ? <span className="rank-pill" style={{ color: "#5B8DB8" }}>#{r07} '07</span> : null}
            </div>
            {inList && <SeenDots movie={inList} />}
            {r && r.poster_path
              ? <img className="card-poster" src={IMG + r.poster_path} alt={t} loading="lazy" onClick={inList ? () => onOpen(inList) : undefined} />
              : <div className="no-poster" onClick={inList ? () => onOpen(inList) : undefined}>{t}</div>}
            <div className="card-body">
              <div className="card-title" onClick={inList ? () => onOpen(inList) : undefined}>{t}</div>
              <div className="card-sub">
                <span>{y}</span>
                {r && r.vote_average ? <span>{"\u2605"} {r.vote_average.toFixed(1)}</span> : null}
              </div>
              {inList
                ? <button className="seen-btn on" style={{ background: "#2a2a2a", color: "#aaa", cursor: "default" }}>
                    {inList.seenBy.includes(user) ? "\u2713 Seen" : "Queued"}
                  </button>
                : <button
                    className="add-btn"
                    style={{ marginTop: "auto", padding: "7px 0" }}
                    disabled={!r}
                    onClick={() => r && onAdd({ ...r, media_type: "movie" }, { category: "AFI" })}
                  >
                    {r ? "+ Add to queue" : "Loading..."}
                  </button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
